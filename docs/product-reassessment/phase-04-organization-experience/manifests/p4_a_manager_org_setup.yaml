# Phase 4 — organization manager first-use and organization profile creation.
# Identity: appointment-review-manager@example.test (role Organization Manager).
# This manifest only attempts the visible organization setup path; assertions are
# used instead of hard waits at expected transitions so a blocked step still
# yields screenshots and DOM evidence instead of aborting the run.
app: appointment
base_url: http://localhost:49510
default_role: appointment-review-manager@example.test
auth:
  type: frappe_session
  username: appointment-review-manager@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
options:
  ignore_baseline_drift: true
scenarios:
  - id: p4_manager_org_setup
    title: Organization manager first screen and organization profile
    viewport:
      width: 1440
      height: 960
    timeout_ms: 180000
    checks: []
    routes:
      - path: /home
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p4-mgr-01-first-screen.png
        full_page: false
      - action: get_dom_snapshot
        name: p4-mgr-01-first-screen.html
      - action: click
        selector: ':nth-match(button:has-text("Continue"), 2)'
        assertions:
          - type: visible_text
            value: "Organization Profile"
      - action: wait_for
        selector: '#organizationName'
      - action: screenshot
        name: p4-mgr-02-org-profile.png
        full_page: false
      - action: fill
        selector: '#organizationName'
        value: "P4 Organization"
      - action: click
        selector: '[role="combobox"]'
      - action: click
        selector: '[role="option"]:has-text("Other")'
      - action: fill
        selector: '#email'
        value: "p4-org@example.test"
      - action: fill
        selector: '#phone'
        value: "+251900000400"
      - action: screenshot
        name: p4-mgr-03-org-profile-filled.png
        full_page: false
      - action: click
        selector: 'button:has-text("Next: Add Providers")'
        assertions:
          - type: network_request
            url_contains: save_organization_profile
            method: POST
            status_min: 200
            status_max: 299
            timeout_ms: 20000
      - action: screenshot
        name: p4-mgr-04-after-org-save.png
        full_page: false
      - action: get_dom_snapshot
        name: p4-mgr-04-after-org-save.html
      - action: get_console_errors
      - action: get_network_errors

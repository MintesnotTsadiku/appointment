# Phase 4 — provider at narrow mobile width plus one bounded out-of-authority action.
# Identity: appointment-review-provider@example.test (Provider).
app: appointment
base_url: http://localhost:49510
default_role: appointment-review-provider@example.test
auth:
  type: frappe_session
  username: appointment-review-provider@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
options:
  ignore_baseline_drift: true
scenarios:
  - id: p4_prov_mobile_calendar
    title: Provider calendar at 390x844
    viewport: {width: 390, height: 844}
    timeout_ms: 30000
    checks: []
    routes:
      - path: /calendar
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p4-prov-mobile-01-calendar.png
        full_page: true
      - action: get_dom_snapshot
        name: p4-prov-mobile-01-calendar.html

  - id: p4_prov_mobile_availability
    title: Provider availability at 390x844
    viewport: {width: 390, height: 844}
    timeout_ms: 30000
    checks: []
    routes:
      - path: /settings/availability
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p4-prov-mobile-02-availability.png
        full_page: true
      - action: get_dom_snapshot
        name: p4-prov-mobile-02-availability.html
      - action: get_console_errors
      - action: get_network_errors

  - id: p4_prov_admin_denied
    title: Provider attempts a System-Manager-only surface (out of authority)
    viewport: {width: 1440, height: 960}
    timeout_ms: 30000
    checks: []
    routes:
      - path: /admin/dashboard
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p4-prov-05-admin-denied.png
        full_page: true
      - action: get_dom_snapshot
        name: p4-prov-05-admin-denied.html

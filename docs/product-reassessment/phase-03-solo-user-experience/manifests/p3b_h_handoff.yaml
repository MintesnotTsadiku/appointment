# Phase 3 follow-up — customer-to-provider handoff in ONE run (cleanup-safe).
# A single appointment.qa_runner.run invocation runs all four scenarios before
# its finally-block teardown, so the Booking Event created in scenario 1 still
# exists during the provider inspection in scenarios 3-4. Scenario 2 verifies the
# record's existence through a provider-accessible API before the UI inspection.
# Identity is the provider session because the installed harness applies one
# `auth` per manifest and cannot switch to a separate Guest mid-run (documented).
app: appointment
base_url: http://localhost:49510
default_role: p3b-solo-owner@example.test
auth:
  type: frappe_session
  username: p3b-solo-owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: false
capture_instruction_timeline: false
options:
  ignore_baseline_drift: true
  timezone_id: Asia/Kolkata
scenarios:
  - id: p3b_handoff_booking
    title: Public booking creates a Booking Event (handoff scenario)
    viewport:
      width: 1440
      height: 960
    timeout_ms: 180000
    checks: []
    routes:
      - path: /schedule/org/p3b-org/evt-2026-000001
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="booking-tomorrow"]'
    actions:
      - action: click
        selector: '[data-qa="booking-tomorrow"]'
      - action: click
        selector: ':nth-match([data-qa="booking-slot"]:not([disabled]), 1)'
      - action: wait_for
        selector: "#userName"
      - action: fill
        selector: "#userName"
        value: "P3B Handoff Customer"
      - action: fill
        selector: "#userEmail"
        value: "p3b-handoff@example.test"
      - action: fill
        selector: "#userPhone"
        value: "+251900000777"
      - action: click
        selector: '[data-qa="booking-confirm"]'
        assertions:
          - type: visible_text
            value: "Booking Confirmed!"
            timeout_ms: 20000
          - type: network_request
            url_contains: book_time_slot
            method: POST
            status_min: 200
            status_max: 299
            response_body_contains: "event_id"
            timeout_ms: 20000
      - action: screenshot
        name: p3b-handoff-01-booking-confirmed.png
        full_page: false
      - action: get_dom_snapshot
        name: p3b-handoff-01-booking-confirmed.html

  - id: p3b_handoff_exists_before_inspection
    title: The created Booking Event still exists (provider-accessible API)
    viewport:
      width: 1440
      height: 960
    timeout_ms: 120000
    checks: []
    routes:
      - path: /api/method/appointment.overrides.event_override.get_events_from_doc?doctype=User%20Appointment%20Availability&docname=p3b-solo-owner%40example.test
        assertions:
          - type: text_contains
            value: "P3B Handoff Customer"
    actions:
      - action: screenshot
        name: p3b-handoff-02-record-exists.png
        full_page: false
      - action: get_dom_snapshot
        name: p3b-handoff-02-record-exists.html

  - id: p3b_handoff_provider_reception
    title: Provider day view for the booked date
    viewport:
      width: 1440
      height: 960
    timeout_ms: 120000
    checks: []
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="reception-heading"]'
    actions:
      - action: click
        selector: 'button:has(svg.lucide-chevron-right)'
      - action: screenshot
        name: p3b-handoff-03-reception-booked-date.png
        full_page: false
        assertions:
          - type: text_contains
            value: "P3B Handoff Customer"
      - action: get_dom_snapshot
        name: p3b-handoff-03-reception-booked-date.html

  - id: p3b_handoff_provider_calendar
    title: Provider calendar for the booking month
    viewport:
      width: 1440
      height: 960
    timeout_ms: 120000
    checks: []
    routes:
      - path: /calendar
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p3b-handoff-04-calendar.png
        full_page: false
        assertions:
          - type: text_contains
            value: "P3B Handoff Customer"
      - action: get_console_errors
      - action: get_network_errors
      - action: get_dom_snapshot
        name: p3b-handoff-04-calendar.html

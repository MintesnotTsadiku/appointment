# Phase 3 — narrow mobile repeat of the customer booking first screen (Guest).
app: appointment
base_url: http://localhost:49510
default_role: p3-solo-customer@example.test
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: false
capture_instruction_timeline: false
options:
  ignore_baseline_drift: true
scenarios:
  - id: p3_customer_booking_mobile
    title: Customer booking first screen at mobile width
    viewport:
      width: 390
      height: 844
    timeout_ms: 150000
    checks: []
    routes:
      - path: /schedule/org/p3solo-org/evt-2026-000001
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: visible_selector
            value: '[data-qa="booking-tomorrow"]'
    actions:
      - action: screenshot
        name: p3-mobile-booking.png
        full_page: false
      - action: get_console_errors
      - action: get_network_errors

# Phase 3 trial manifest (solo identity + first screen).
# Proves the runner can authenticate as the fresh solo user, verify the logged-in
# identity, capture screenshots/trace and report the video policy. Not the full
# journey; a tooling validation run.
app: appointment
base_url: http://localhost:49510
default_role: p3-solo-owner@example.test
auth:
  type: frappe_session
  username: p3-solo-owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
scenarios:
  - id: p3_solo_identity_check
    title: Fresh solo session is the intended user
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /api/method/frappe.auth.get_logged_user
        assertions:
          - type: text_contains
            value: "p3-solo-owner@example.test"
    actions:
      - action: screenshot
        name: p3-solo-identity.png
        full_page: false
      - action: get_dom_snapshot
        name: p3-solo-identity.html

  - id: p3_solo_first_screen
    title: Fresh solo first screen after login
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /home
        assertions:
          - type: network_idle
          - type: no_blank_page
    actions:
      - action: screenshot
        name: p3-solo-first-screen.png
        full_page: false
        assertions:
          - type: visible_selector
            value: '[data-qa="app-shell"]'
      - action: get_dom_snapshot
        name: p3-solo-first-screen.html

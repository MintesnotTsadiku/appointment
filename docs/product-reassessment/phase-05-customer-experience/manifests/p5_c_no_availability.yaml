# Phase 5 — bounded "no available appointments" recovery check.
#
# The provider empties the fixture availability windows, so the customer should
# see an honest empty state instead of bookable slots. Fixture-assisted.
app: appointment
base_url: http://localhost:49510
default_role: "anonymous-customer"
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
fixtures:
  provider: p5_fixtures:values_closed
scenarios:
  - id: p5_c1_no_availability
    title: No-availability day shows an honest empty state
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /schedule/org/{qa_org_slug}/{qa_service_slug}
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: visible_selector
            value: '[data-qa="booking-tomorrow"]'
    actions:
      - action: click
        selector: '[data-qa="booking-tomorrow"]'
        timeout_ms: 15000
      - action: get_text
        selector: 'body'
        name: p5-c1-body.txt
      - action: screenshot
        name: p5-c1-no-availability.png
        full_page: true
      - action: observe_accessibility_tree
        name: p5-c1-no-availability-a11y.json
      - action: get_dom_snapshot
        name: p5-c1-no-availability.html
      - action: get_console_errors
      - action: get_network_errors

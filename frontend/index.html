<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/appointment/appointment-logo.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="Professional appointment scheduling for businesses - መርሃግብር" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scheduler" />
    <link rel="apple-touch-icon" href="/assets/appointment/frontend/icons/apple-touch-icon-180x180.png" />
    
    <!-- Windows/Edge PWA Support -->
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <meta name="msapplication-TileImage" content="/assets/appointment/frontend/icons/icon-144x144.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Scheduler - Scheduling Platform</title>
    <meta name="description" content="Scheduler is a platform for scheduling appointments. It is a platform for scheduling appointments for businesses and organizations. It is a platform for scheduling appointments for businesses and organizations.">
    <meta name="keywords" content="Scheduler, scheduling appointments, appointments, scheduling, platform, business, organization">
    <meta name="author" content="Scheduler">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="google" content="notranslate">
    <meta name="google-site-verification" content="google-site-verification=google-site-verification">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Load everything from the page context to window object
      // This will allow us to access frappe boot in our react app.
      // CRITICAL FIX: Safe offline handling - check if Frappe boot data exists
      window.csrf_token = '{{ csrf_token }}' || '';
      if (!window.frappe) window.frappe = {};
  
      window.app_name = "{{ app_name }}" || "Scheduler";
  
      // Safely parse boot data - handle offline scenario where template vars might be empty
      try {
        if (typeof {{ boot }} !== 'undefined' && {{ boot }}) {
          frappe.boot = JSON.parse({{ boot }});
          frappe.csrf_token = "{{ csrf_token }}" || '';
        } else {
          // Offline mode - set minimal boot data
          frappe.boot = {
            user: { name: 'Guest' },
            sysdefaults: {},
            app_name: window.app_name
          };
          frappe.csrf_token = '';
          
          // Set offline flag for React app to disable write operations
          window.__PWA_OFFLINE__ = true;
        }
      } catch (e) {
        console.warn('Failed to parse Frappe boot data:', e);
        // Fallback for offline mode
        frappe.boot = {
          user: { name: 'Guest' },
          sysdefaults: {},
          app_name: window.app_name
        };
        frappe.csrf_token = '';
        window.__PWA_OFFLINE__ = true;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

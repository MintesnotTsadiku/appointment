  - id: landing_handoff_booking
    title: Showcase door hands off to a published booking entry
    viewport: {width: 1440, height: 900}
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="landing-world"]'
    actions:
      - action: scroll
        delta_y: 5000
      - action: scroll
        delta_y: 5000
      - action: scroll
        delta_y: 5000
      - action: scroll
        delta_y: 5000
      - action: wait_for
        selector: '[data-qa="landing-door"] a[href="/bloom-studio/book"]'
        timeout_ms: 15000
      - action: click
        selector: '[data-qa="landing-door"] a[href="/bloom-studio/book"]'
        assertions:
          - type: url_contains
            value: /bloom-studio/book
          - type: visible_selector
            value: '[data-pe-booking]'
      - action: screenshot
        name: handoff-bloom-book.png
        full_page: false
      - action: get_console_errors
      - action: get_network_errors
  - id: landing_handoff_auth
    title: Primary call to action hands off to sign-up and sign-in
    viewport: {width: 1440, height: 900}
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="landing-start"]'
    actions:
      - action: click
        selector: '[data-qa="landing-start"]'
        assertions:
          - type: url_contains
            value: /signup
      - action: open_url
        url: /
      - action: click
        selector: '[data-qa="landing-bar"] a[href="/login"]'
        assertions:
          - type: url_contains
            value: /login
          - type: visible_selector
            value: '[data-qa="login-heading"]'
      - action: open_url
        url: /
        assertions:
          - type: visible_selector
            value: '[data-qa="landing-world"]'
      - action: get_console_errors
      - action: get_network_errors
  - id: landing_amharic
    title: Landing story switches to Amharic
    viewport: {width: 1440, height: 900}
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="language-toggle"]'
    actions:
      - action: press
        selector: '[data-qa="language-toggle"]'
        key: Enter
        assertions:
          - type: visible_text
            value: 'ቀኑን ይጀምሩ'
          - type: network_request
            url_contains: appointment.scheduler.translation.messages
            status: 200
      - action: screenshot
        name: amharic-dawn.png
        full_page: false
      - action: click
        selector: '[data-qa="landing-timetable"] a[href="#moves"]'
        assertions:
          - type: visible_text
            value: 'ዕቅድ ይለወጣል'
      - action: scroll
        delta_y: 1
      - action: screenshot
        name: amharic-moves.png
        full_page: false
      - action: get_console_errors
      - action: get_network_errors

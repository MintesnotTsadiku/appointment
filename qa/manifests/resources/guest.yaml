# Run appointment.tests.resources_qa_fixtures.setup first and cleanup afterwards.
app: appointment
base_url: http://127.0.0.84:44430
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.resources_qa_fixtures.browser_values
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-resources
scenarios:
- id: res_guest_en_desktop
  title: 'Guest: no Cut and shape time with Eden on the QA day (main studio chairs
    blocked), open times with Rahel (en, desktop)'
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /schedule/org/bloom-studio
    assertions:
    - type: network_idle
  actions:
  - action: wait_for
    selector: '[data-qa="booking-service"]:has-text("Cut and shape"):has-text("Eden
      Tadesse")'
  - action: click
    selector: '[data-qa="booking-service"]:has-text("Cut and shape"):has-text("Eden
      Tadesse")'
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_res_day}"]'
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_res_day}"]'
  - action: wait_for
    selector: '[data-qa="booking-slots"][data-qa-open="0"]'
  - action: screenshot
    name: res_guest_en_desktop-1-eden-closed.png
    full_page: true
  - action: open_url
    url: /schedule/org/bloom-studio
  - action: wait_for
    selector: '[data-qa="booking-service"]:has-text("Cut and shape"):has-text("Rahel
      Girma")'
  - action: click
    selector: '[data-qa="booking-service"]:has-text("Cut and shape"):has-text("Rahel
      Girma")'
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_res_day}"]'
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_res_day}"]'
  - action: wait_for
    selector: '[data-qa="booking-slots"]:not([data-qa-open="0"])'
  - action: screenshot
    name: res_guest_en_desktop-2-rahel-open.png
    full_page: true
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors

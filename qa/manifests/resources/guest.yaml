- id: res_guest_am_desktop
  title: 'Guest: no Cut and shape time with Eden on the QA day (main studio chairs
    blocked), open times with Rahel (am, desktop)'
  viewport: *id003
  checks: []
  routes:
  - path: /
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="language-toggle"]'
  actions:

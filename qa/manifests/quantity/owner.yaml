# Run appointment.tests.quantity_qa_fixtures.setup first, guest.yaml before owner.yaml, then cleanup.
app: appointment
base_url: http://127.0.0.84:44430
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.quantity_qa_fixtures.browser_values
artifact_root: /tmp/agent_browser_qa/appointment-quantity
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
scenarios:
- id: qty_owner_en_desktop
  title: 'Owner: room use in Insights, quantity setting, reception × 3 and room filter
    (en, desktop)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
  actions:
  - action: wait_for
    selector: '[data-qa="analytics-resource-use"]'
    assertions:
    - type: visible_text
      value: Studio seats (QA)
  - action: screenshot
    name: qty_owner_en_desktop-1-insights.png
    full_page: true
  - action: open_url
    url: /settings/services/{qa_qty_service}
  - action: wait_for
    selector: '[data-qa="service-allow-quantity"][data-state="checked"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="service-providers-hidden"]'
  - action: screenshot
    name: qty_owner_en_desktop-2-service.png
    full_page: true
  - action: open_url
    url: /reception?date={qa_qty_day}
  - action: wait_for
    selector: '[data-qa-appointment-name="{qa_qty_guest_id}"] [data-qa="appointment-quantity"]'
  - action: click
    selector: '[data-qa="desk-filter-resource"]'
  - action: click
    selector: '[role="option"]:has-text("Studio seats (QA)")'
    assertions:
    - type: network_request
      url_contains: resource=
      status: 200
    - type: visible_selector
      value: '[data-qa-appointment-name="{qa_qty_guest_id}"]'
  - action: screenshot
    name: qty_owner_en_desktop-3-reception-filter.png
    full_page: true
  - &id002
    action: get_console_errors
  - &id003
    action: get_network_errors
- id: qty_owner_am_mobile
  title: 'Owner: room use in Insights, quantity setting, reception × 3 and room filter
    (am, mobile)'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
  actions:
  - &id001
    action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: '[data-qa="analytics-resource-use"]'
    assertions:
    - type: visible_text
      value: Studio seats (QA)
  - action: screenshot
    name: qty_owner_am_mobile-1-insights.png
    full_page: true
  - action: open_url
    url: /settings/services/{qa_qty_service}
  - action: wait_for
    selector: '[data-qa="service-allow-quantity"][data-state="checked"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="service-providers-hidden"]'
  - action: screenshot
    name: qty_owner_am_mobile-2-service.png
    full_page: true
  - *id001
  - *id002
  - *id003

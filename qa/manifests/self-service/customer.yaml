# Run appointment.tests.self_service_qa_fixtures.setup first and cleanup afterwards.
# Late booking: reschedule blocked, cancel with fee. Free booking: reschedule, then free cancel. Then an invalid link.
app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-self-service
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.self_service_qa_fixtures.browser_values
scenarios:
- id: manage_en_desktop
  title: Customer manages bookings from the email link (en, desktop)
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: '{qa_manage_late_en_desktop}'
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="manage-summary"]'
    - type: no_blank_page
  actions:
  - action: wait_for
    selector: '[data-qa="manage-reschedule-blocked"]'
  - action: screenshot
    name: manage_en_desktop-1-late-overview.png
    full_page: true
  - action: click
    selector: '[data-qa="manage-start-cancel"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="manage-cancel-terms"][data-qa-state="late"]'
  - action: click
    selector: '[data-qa="manage-accept-fee"]'
  - action: screenshot
    name: manage_en_desktop-2-late-terms.png
    full_page: true
  - action: click
    selector: '[data-qa="manage-cancel-confirm"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.self_service.cancel
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="manage-cancelled-fee"]'
  - action: screenshot
    name: manage_en_desktop-3-late-cancelled.png
    full_page: true
  - action: open_url
    url: '{qa_manage_free_en_desktop}'
  - action: wait_for
    selector: '[data-qa="manage-start-reschedule"]'
  - action: click
    selector: '[data-qa="manage-start-reschedule"]'
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: screenshot
    name: manage_en_desktop-4-free-picked.png
    full_page: true
  - action: click
    selector: '[data-qa="manage-reschedule-confirm"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.self_service.reschedule
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="manage-moved"]'
    - type: url_contains
      value: /booking/
  - action: screenshot
    name: manage_en_desktop-5-free-moved.png
    full_page: true
  - action: click
    selector: '[data-qa="manage-start-cancel"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="manage-cancel-terms"][data-qa-state="free"]'
  - action: click
    selector: '[data-qa="manage-cancel-confirm"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.self_service.cancel
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="manage-cancelled"]'
  - action: screenshot
    name: manage_en_desktop-6-free-cancelled.png
    full_page: true
  - action: open_url
    url: '{qa_manage_invalid}'
    assertions:
    - type: visible_selector
      value: '[data-qa="manage-invalid"]'
  - action: screenshot
    name: manage_en_desktop-7-invalid.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

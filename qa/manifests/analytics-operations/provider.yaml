app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.provider1@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-analytics-operations
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
fixtures:
  provider: appointment.tests.rich_demo.browser_values
scenarios:
- id: analytics_provider_0
  title: provider analytics /calendar
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /calendar
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-qa="provider-insight-brief"]'
  actions:
  - action: screenshot
    name: provider-0.png
    full_page: true
  - action: get_dom_snapshot
    name: provider-0.html
  - action: get_console_errors
  - action: get_network_errors
- id: analytics_provider_1
  title: provider analytics /analytics
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-qa="workspace-analytics"]'
  actions:
  - action: screenshot
    name: provider-1.png
    full_page: true
  - action: get_dom_snapshot
    name: provider-1.html
  - action: get_console_errors
  - action: get_network_errors

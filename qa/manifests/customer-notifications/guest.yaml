  - action: wait_for
    selector: '[data-qa="booking-tomorrow"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '#userName'
  - action: fill
    selector: '#userName'
    value: QA Notify AM desktop
  - action: fill
    selector: '#userEmail'
    value: qa-notify-am-desktop@example.test
  - action: screenshot
    name: notify_guest_am_desktop-2-details.png
    full_page: true
  - action: click
    selector: '[data-qa="booking-confirm"]'
    assertions:

# Functional browser QA suite (no visual baseline gating; screenshots are evidence).
# Deterministic fixtures are created and cleaned up by appointment.qa_runner.run
# through appointment.qa_fixtures. Every scenario performs a real product action
# and asserts an observable result with stable `data-qa-*` selectors.
#
# Console/network policy: the product SPA and the Frappe Desk frame both open a
# Socket.IO connection. Engine.io rejects overlapping polling requests with
# `400`s (transport artifact, not an application API failure). Scenarios assert
# the realtime handshake positively (`network_request` on `/socket.io/` with a
# 2xx status) and otherwise gate on semantic/action assertions.
app: appointment
base_url: http://localhost:49510
default_role: Administrator
auth:
  type: frappe_session
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: false
capture_instruction_timeline: false
timeout_ms: 180000
options:
  ignore_baseline_drift: true
fixtures:
  provider: appointment.qa_fixtures.fixture_values
scenarios:
  - id: appointment_app_shell
    title: Authenticated application shell loads
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /home
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="app-shell"]'
          - type: network_request
            url_contains: /socket.io/
            status_min: 200
            status_max: 299
            min_count: 1
            timeout_ms: 15000
          - type: no_blank_page
          - type: screenshot_not_blank

  - id: appointment_provider_service_configuration
    title: Created service survives a reload
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /settings/manage
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="manage-services-toggle"]'
          - type: text_contains
            value: "{qa_service_name}"
    actions:
      - action: click
        selector: '[data-qa="manage-add-service"]'
      - action: wait_for
        selector: '[data-qa="manage-service-name"]'
      - action: fill
        selector: '[data-qa="manage-service-name"]'
        value: "{qa_new_service_name}"
      - action: click
        selector: '[data-qa="manage-create-submit"]'
        assertions:
          - type: visible_text
            value: "{qa_new_service_name}"
      - action: open_url
        url: /settings/manage
        wait_until: load
        timeout_ms: 60000
      - action: wait_for
        selector: '[data-qa="manage-services-toggle"]'
      - action: screenshot
        name: service-after-reload
        full_page: false
        assertions:
          - type: text_contains
            value: "{qa_new_service_name}"

  - id: appointment_availability_persistence
    title: Saved availability survives a reload
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /settings/availability
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="availability-location-select"]'
    actions:
      - action: select
        selector: '[data-qa="availability-location-select"]'
        value: "{qa_admin_location_id}"
      - action: wait_for
        selector: '[data-qa="availability-day-Saturday"]'
      - action: click
        selector: '[data-qa="availability-day-Saturday"]'
      - action: click
        selector: '[data-qa="availability-save"]'
      - action: screenshot
        name: availability-after-save
        full_page: false
      - action: get_dom_snapshot
        name: availability-after-save.html
        assertions:
          - type: visible_text
            value: "Availability saved successfully!"
      - action: open_url
        url: /settings/availability
        wait_until: load
        timeout_ms: 60000
      - action: select
        selector: '[data-qa="availability-location-select"]'
        value: "{qa_admin_location_id}"
      - action: wait_for
        selector: '[data-qa="availability-day-Saturday"]:checked'
      - action: screenshot
        name: availability-after-reload
        full_page: false
        assertions:
          - type: visible_selector
            value: '[data-qa="availability-day-Saturday"]:checked'

  - id: appointment_public_booking
    title: Public booking creates a confirmed appointment
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /schedule/org/{qa_org_slug}/{qa_service_slug}
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="booking-tomorrow"]'
    actions:
      - action: click
        selector: '[data-qa="booking-tomorrow"]'
      - action: wait_for
        selector: ':nth-match([data-qa="booking-slot"]:not([disabled]), 1)'
      - action: click
        selector: ':nth-match([data-qa="booking-slot"]:not([disabled]), 1)'
      - action: wait_for
        selector: "#userName"
      - action: fill
        selector: "#userName"
        value: "{qa_customer_name}"
      - action: fill
        selector: "#userEmail"
        value: "{qa_customer_email}"
      - action: fill
        selector: "#userPhone"
        value: "+251900000222"
      - action: screenshot
        name: booking-before-submit
        full_page: false
      - action: click
        selector: '[data-qa="booking-confirm"]'
        assertions:
          - type: visible_text
            value: "Booking Confirmed!"
          - type: network_request
            url_contains: book_time_slot
            method: POST
            status_min: 200
            status_max: 299
            timeout_ms: 20000
      - action: screenshot
        name: booking-confirmation
        full_page: false
        assertions:
          - type: visible_selector
            value: '[data-qa="booking-success"]'

  - id: appointment_reschedule
    title: QA appointment reschedules through the reception edit modal
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
    actions:
      - action: click
        selector: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
      - action: wait_for
        selector: '[data-qa="edit-appointment-modal"]'
      - action: click
        selector: '[data-qa="edit-time-trigger"]'
      - action: wait_for
        selector: '[data-qa="edit-time-hour-3"]'
      - action: click
        selector: '[data-qa="edit-time-hour-3"]'
      - action: click
        selector: '[data-qa="edit-time-minute-0"]'
      - action: click
        selector: '[data-qa="edit-time-period-PM"]'
      - action: screenshot
        name: reschedule-before-submit
        full_page: false
      - action: click
        selector: '[data-qa="appointment-update-submit"]'
        assertions:
          - type: visible_text
            value: "Appointment updated!"
          - type: network_request
            url_contains: update_appointment
            method: POST
            status_min: 200
            status_max: 299
            request_json_path: start_time
            request_json_value: "15:00:00"
            timeout_ms: 20000
      - action: open_url
        url: /reception
        wait_until: load
        timeout_ms: 60000
      - action: click
        selector: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
      - action: wait_for
        selector: '[data-qa="edit-appointment-modal"]'
      - action: screenshot
        name: reschedule-after-reload
        full_page: false
        assertions:
          - type: text_contains
            selector: '[data-qa="edit-time-trigger"]'
            value: "03:00 PM"

  - id: appointment_cancel
    title: QA appointment cancels through the reception edit modal
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
    actions:
      - action: click
        selector: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
      - action: wait_for
        selector: '[data-qa="edit-appointment-modal"]'
      - action: select
        selector: '[data-qa="appointment-status"]'
        value: "Cancelled"
      - action: screenshot
        name: cancel-before-submit
        full_page: false
      - action: click
        selector: '[data-qa="appointment-update-submit"]'
        assertions:
          - type: visible_text
            value: "Appointment updated!"
          - type: network_request
            url_contains: update_appointment
            method: POST
            status_min: 200
            status_max: 299
            request_json_path: status
            request_json_value: "Cancelled"
            timeout_ms: 20000
      - action: open_url
        url: /reception
        wait_until: load
        timeout_ms: 60000
      - action: click
        selector: '[data-qa="appointment-card"][data-qa-appointment-name="{qa_appointment_name}"]'
      - action: wait_for
        selector: '[data-qa="edit-appointment-modal"]'
      - action: screenshot
        name: cancel-after-reload
        full_page: false
        assertions:
          - type: text_contains
            selector: '[data-qa="appointment-status-value"]'
            value: "Cancelled"

  - id: appointment_reception_assignment
    title: Walk-in is queued then assigned to a slot
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="reception-heading"]'
    actions:
      - action: click
        selector: '[data-qa="reception-add-walkin"]'
      - action: wait_for
        selector: '[data-qa="walkin-client-name"]'
      - action: fill
        selector: '[data-qa="walkin-client-name"]'
        value: "{qa_marker} Walk-In"
      - action: fill
        selector: '[data-qa="walkin-client-phone"]'
        value: "+251900000333"
      - action: fill
        selector: "#client_email"
        value: "{qa_customer_email}"
      - action: select
        selector: "#service_requested"
        value: "{qa_service_id}"
      - action: select
        selector: "#location_name"
        value: "{qa_location_id}"
      - action: select
        selector: "#provider_preferred"
        value: "{qa_provider_id}"
      - action: click
        selector: '[data-qa="walkin-submit"]'
      - action: wait_for
        selector: '[data-qa="walkin-card"]:has-text("{qa_marker} Walk-In")'
      - action: screenshot
        name: walkin-queued
        full_page: false
      - action: click
        selector: '[data-qa="walkin-card"]:has-text("{qa_marker} Walk-In") [data-qa="walkin-assign"]'
        assertions:
          - type: visible_text
            value: "Walk-in assigned!"
          - type: network_request
            url_contains: assign_walk_in_to_slot
            method: POST
            status_min: 200
            status_max: 299
            response_json_path: message.success
            response_json_value: true
            timeout_ms: 20000
      - action: wait_for
        selector: '[data-qa="appointment-card"]:has-text("{qa_marker} Walk-In")'
      - action: screenshot
        name: walkin-assigned
        full_page: false
        assertions:
          - type: visible_text
            value: "{qa_marker} Walk-In"

  - id: appointment_language_persistence
    title: Amharic language selection survives a reload
    viewport:
      width: 1440
      height: 960
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_text
            value: "Pricing"
    actions:
      - action: click
        selector: '[data-qa="language-toggle"]'
        assertions:
          - type: visible_text
            value: "ዋጋ"
      - action: screenshot
        name: language-amharic
        full_page: false
      - action: open_url
        url: /
        wait_until: load
        timeout_ms: 60000
      - action: wait_for
        selector: '[data-qa="language-toggle"]'
      - action: screenshot
        name: language-after-reload
        full_page: false
        assertions:
          - type: visible_text
            value: "ዋጋ"

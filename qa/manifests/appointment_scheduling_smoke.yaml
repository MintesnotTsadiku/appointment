app: appointment
base_url: http://127.0.0.141:32490
default_role: Administrator
auth:
  type: frappe_session
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: false
capture_instruction_timeline: false
timeout_ms: 180000
scenarios:
  - id: appointment_provider_workspace
    title: Provider workspace, calendar, availability and service configuration
    viewport:
      width: 1440
      height: 960
    checks:
      - no_console_errors
      - no_failed_network_requests
    routes:
      - path: /home
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /calendar
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /settings
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /settings/availability
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /settings/manage
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /settings/services
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /settings/team
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
  - id: appointment_reception_workspace
    title: Reception desk and walk-in queue
    viewport:
      width: 1440
      height: 960
    checks:
      - no_console_errors
      - no_failed_network_requests
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank
      - path: /schedule
        assertions:
          - type: network_idle
          - type: no_blank_page
          - type: screenshot_not_blank

# Run appointment.tests.develop_features_qa_fixtures.setup first and cleanup afterwards.
# An independent provider (develop's individual_owner workspace) inside the merged staff shell.
app: appointment
base_url: http://127.0.0.146:47800
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.develop_features_qa_fixtures.browser_values
artifact_root: /tmp/agent_browser_qa/appointment-develop-features
default_role: Staff
auth:
  type: frappe_session
  username: qa-independent-owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
scenarios:
- id: dev_independent_desktop
  title: 'Independent provider: home, booking page settings and Insights (en, desktop)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="staff-shell"]'
    - type: visible_selector
      value: '[data-qa="nav-analytics"]'
  actions:
  - action: screenshot
    name: dev_independent_desktop-1-home.png
    full_page: true
  - action: open_url
    url: /settings/independent-booking
  - action: wait_for
    selector: '[data-qa="staff-shell"] form, [data-qa="staff-shell"] h1'
  - action: screenshot
    name: dev_independent_desktop-2-booking-page.png
    full_page: true
  - action: open_url
    url: /analytics
  - action: wait_for
    selector: '[data-qa="analytics-export"]'
  - action: screenshot
    name: dev_independent_desktop-3-insights.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

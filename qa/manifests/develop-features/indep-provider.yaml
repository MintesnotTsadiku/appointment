# Run appointment.tests.develop_features_qa_fixtures.setup first and cleanup afterwards.
# An independent provider's Customers and Notifications pages.
app: appointment
base_url: http://127.0.0.146:47800
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.develop_features_qa_fixtures.browser_values
artifact_root: /tmp/agent_browser_qa/appointment-independent-customers
default_role: Staff
auth:
  type: frappe_session
  username: qa-independent-owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
scenarios:
- id: indep_provider_en_desktop
  title: 'Independent provider: Customers list and profile, read-only notification settings (en, desktop)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /customers
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="nav-customers"]'
  actions:
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: visible_text
      value: Hanna Mekonnen
  - action: screenshot
    name: indep_provider_en_desktop-1-customers.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: url_contains
      value: /customers/CUS-
  - action: screenshot
    name: indep_provider_en_desktop-2-profile.png
    full_page: true
  - action: open_url
    url: /settings/notifications
  - action: wait_for
    selector: '[data-qa="staff-shell"] h1'
  - action: screenshot
    name: indep_provider_en_desktop-3-notifications.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: indep_provider_am_mobile
  title: 'Independent provider: Customers in Amharic (am, mobile)'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /customers
    assertions:
    - type: network_idle
  actions:
  - action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
  - action: screenshot
    name: indep_provider_am_mobile-1-customers.png
    full_page: true
  - action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
  - action: get_console_errors
  - action: get_network_errors

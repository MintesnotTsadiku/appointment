app: appointment
base_url: http://127.0.0.174:41960
default_role: Staff
auth:
  type: frappe_session
  username: multi.manager@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-rich-demo
capture_trace: true
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.rich_demo.browser_values
scenarios:
- id: multi_switch_bloom
  title: Coordinator enters Bole Bloom Hair Studio
  viewport:
    width: 1440
    height: 960
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Bole Bloom Hair Studio") button'
  - action: wait_for
    selector: '[data-qa="reception-scope"]'
    assertions:
    - type: url_contains
      value: /reception
  - action: screenshot
    name: multi-bloom-selected.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: multi_switch_tena
  title: Coordinator enters Tena Family Clinic
  viewport:
    width: 1440
    height: 960
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Tena Family Clinic") button'
  - action: wait_for
    selector: '[data-qa="topnav-theme"]'
    assertions:
    - type: url_contains
      value: /home
  - action: screenshot
    name: multi-tena-selected.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

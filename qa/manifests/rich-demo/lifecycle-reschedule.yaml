app: appointment
base_url: http://127.0.0.174:41960
default_role: Provider
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-rich-demo
capture_trace: true
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
fixtures:
  provider: appointment.tests.rich_demo.browser_values
scenarios:
- id: rich_staff_reschedule
  title: Salon owner reschedules a seeded future booking
  viewport:
    width: 1440
    height: 960
  checks: []
  routes:
  - path: /reception
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="desk-next-day"]'
  actions:
  - action: click
    selector: '[data-qa="desk-next-day"]'
    assertions:
    - type: visible_text
      value: '{demo_lifecycle_customer}'
    - type: network_request
      url_contains: get_desk_appointments
      response_body_contains: '{demo_lifecycle_customer}'
      status: 200
  - action: click
    selector: '[data-qa-appointment-name="{demo_lifecycle_booking}"]'
    assertions:
    - type: visible_text
      value: Manage booking
  - action: fill
    selector: '#booking-change-time'
    value: 11:00 AM
  - action: click
    selector: '[data-qa="booking-reschedule"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.booking.change
      method: POST
      status: 200
  - action: wait_for
    selector: '[data-qa-appointment-name="{demo_lifecycle_booking}"]'
  - action: screenshot
    name: visible-rescheduled-calendar.png
    full_page: true
  - action: click
    selector: '[data-qa-appointment-name="{demo_lifecycle_booking}"]'
    assertions:
    - type: visible_text
      value: Start time
  - action: screenshot
    name: visible-booking-history.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

app: appointment
base_url: http://127.0.0.174:41960
default_role: Staff
auth:
  type: frappe_session
  username: selam.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-rich-demo
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.rich_demo.browser_values
scenarios:
- id: solo_desktop
  title: solo desktop
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /calendar
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: body
  actions:
  - action: screenshot
    name: solo_desktop.png
    full_page: true
  - action: get_dom_snapshot
    name: solo_desktop.html
  - action: get_console_errors
  - action: get_network_errors
- id: solo_mobile
  title: solo mobile
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /calendar
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: body
  actions:
  - action: screenshot
    name: solo_mobile.png
    full_page: true
  - action: get_dom_snapshot
    name: solo_mobile.html
  - action: get_console_errors
  - action: get_network_errors

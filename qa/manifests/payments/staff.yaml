# Run after guest.yaml. The manager confirms two submitted bank transfers.
app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.manager@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-payments
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.payments_qa_fixtures.browser_values
scenarios:
- id: pay_staff_en_desktop
  title: Manager confirms a bank transfer (en, desktop)
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /reception?date={qa_pay_en_desktop_day}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="desk-next-day"]'
  actions:
  - action: wait_for
    selector: '[data-qa-appointment-name="{qa_pay_en_desktop_id}"]'
  - action: press
    selector: '[data-qa-appointment-name="{qa_pay_en_desktop_id}"]'
    key: Enter
    assertions:
    - type: visible_selector
      value: '[data-qa="booking-payment"][data-qa-state="Submitted"]'
  - action: screenshot
    name: pay-staff-en-desktop-1-review.png
  - action: press
    selector: '[data-qa="booking-payment-confirm"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.payments.confirm
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="booking-payment"][data-qa-state="Paid"]'
  - action: screenshot
    name: pay-staff-en-desktop-2-paid.png
  - action: press
    selector: '[data-qa="owned-booking-dialog"]'
    key: Escape
  - &id002
    action: get_console_errors
  - &id003
    action: get_network_errors
- id: pay_staff_am_mobile
  title: Manager confirms a bank transfer (am, mobile)
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /reception?date={qa_pay_am_mobile_day}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="desk-next-day"]'
  actions:
  - &id001
    action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: '[data-qa-appointment-name="{qa_pay_am_mobile_id}"]'
  - action: press
    selector: '[data-qa-appointment-name="{qa_pay_am_mobile_id}"]'
    key: Enter
    assertions:
    - type: visible_selector
      value: '[data-qa="booking-payment"][data-qa-state="Submitted"]'
  - action: screenshot
    name: pay-staff-am-mobile-1-review.png
  - action: press
    selector: '[data-qa="booking-payment-confirm"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.payments.confirm
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="booking-payment"][data-qa-state="Paid"]'
  - action: screenshot
    name: pay-staff-am-mobile-2-paid.png
  - action: press
    selector: '[data-qa="owned-booking-dialog"]'
    key: Escape
  - *id001
  - *id002
  - *id003

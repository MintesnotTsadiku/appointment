# Run appointment.tests.payments_qa_fixtures.setup first. Guests pay a 30% booking fee by bank transfer.
app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-payments
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.payments_qa_fixtures.browser_values
scenarios:
- id: pay_guest_en_desktop
  title: Guest books with a booking fee and sends a bank transfer reference (en, desktop)
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /bloom-studio/book
    assertions:
    - type: network_idle
  actions:
  - action: wait_for
    selector: '[data-pe-booking]'
  - action: click
    selector: :nth-match([data-pe-booking] a.bl-btn, 1)
    assertions:
    - type: url_contains
      value: /schedule/org/
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-tomorrow"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '[data-qa="checkout-payment"]'
  - action: wait_for
    selector: '[data-qa="checkout-method-bank"]'
  - action: fill
    selector: '#userName'
    value: QA Pay EN desktop
  - action: fill
    selector: '#userEmail'
    value: qa-pay-en-desktop@example.test
  - action: screenshot
    name: pay_guest_en_desktop-1-checkout.png
    full_page: true
  - action: click
    selector: '[data-qa="booking-confirm"]'
    assertions:
    - type: network_request
      url_contains: book_time_slot
      method: POST
      status_min: 200
      status_max: 299
      timeout_ms: 25000
    - type: url_contains
      value: /booking/
    - type: visible_selector
      value: '[data-qa="manage-payment"][data-qa-state="Awaiting payment"]'
  - action: wait_for
    selector: '[data-qa="manage-bank-accounts"]'
  - action: screenshot
    name: pay_guest_en_desktop-2-pay-instructions.png
    full_page: true
  - action: fill
    selector: '[data-qa="manage-payment-reference"]'
    value: FT-QA-EN-DESKTOP
  - action: click
    selector: '[data-qa="manage-payment-submit"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.payments.submit_proof
      method: POST
      status: 200
    - type: visible_selector
      value: '[data-qa="manage-payment"][data-qa-state="Submitted"]'
  - action: screenshot
    name: pay_guest_en_desktop-3-submitted.png
    full_page: true
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors

# Run with fixture appointment.tests.develop_features_qa_fixtures ($G/qa.sh runs setup before and cleanup after).
# A guest books an independent provider's offering in Amharic on a phone in dark mode: Habesha time by default,
# the same date and slot picker, details and confirmation.
app: appointment
base_url: http://127.0.0.146:47800
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.develop_features_qa_fixtures.browser_values
artifact_root: /tmp/agent_browser_qa/appointment-controls-independent-booking-am
default_role: Guest
auth:
  type: none
scenarios:
- id: ctl_indep_book_am_mobile_dark
  title: 'Guest books an independent offering in Amharic with Habesha time (am, mobile, dark)'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /schedule/individual/{qa_independent_offering}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="independent-booking"]'
  actions:
  - action: click
    selector: '[data-qa="language-toggle"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: '[data-qa="independent-booking-choose-first"]'
    assertions:
    - type: text_contains
      value: ቀጠሮ ይያዙ
  - action: screenshot
    name: ctl_indep_book_am_mobile_dark-1-picker.png
    full_page: true
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 3)
    timeout_ms: 20000
    assertions:
    - type: text_contains
      value: ጠዋት
  - action: screenshot
    name: ctl_indep_book_am_mobile_dark-2-slots.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 3)
  - action: wait_for
    selector: '[data-qa="independent-booking-chosen"]'
  - action: fill
    selector: '[data-qa="independent-booking-name"]'
    value: ሰላማዊት በቀለ
  - action: fill
    selector: '[data-qa="independent-booking-email-input"]'
    value: qa-indep-picker-am@example.test
  - action: screenshot
    name: ctl_indep_book_am_mobile_dark-3-details.png
    full_page: false
  - action: click
    selector: '[data-qa="independent-booking-submit"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.booking.book
      method: POST
      status_min: 200
      status_max: 299
      timeout_ms: 25000
    - type: visible_selector
      value: '[data-qa="independent-booking-confirmed"]'
  - action: screenshot
    name: ctl_indep_book_am_mobile_dark-4-confirmed.png
    full_page: true
  - action: click
    selector: '[data-qa="language-toggle"]'
  - action: get_console_errors
  - action: get_network_errors

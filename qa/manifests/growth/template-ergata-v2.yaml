    full_page: false
  - action: wait_for
    selector: '[data-qa="ergata-sticky-book"][data-show="false"]'
  - action: scroll
    delta_y: -900
  - action: click
    selector: '#eg2-sessions-title'
  - action: wait_for
    selector: '[data-qa="ergata-sticky-book"][data-show="true"]'
  - action: screenshot

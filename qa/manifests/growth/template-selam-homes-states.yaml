# Seeder-owned showcase; includes deterministic loading and holiday previews.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/selam-homes-states
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
scenarios:
- id: selam-homes_en_1440-states
  title: selam-homes_en_1440-states
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /selam-homes?display=light&preview-time=10:00&preview-holiday=meskel
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-homes-v3"][lang="en"]'
  actions:
  - action: wait_for
    selector: '[data-qa="holiday-moment"]'
  - action: click
    selector: '[data-qa="selam-homes-mode"]'
  - action: screenshot
    name: selam-homes_en_1440-states-hero.png
    full_page: false
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: screenshot
    name: selam-homes_en_1440-states-full.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

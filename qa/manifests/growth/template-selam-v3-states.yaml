# Selam v3 states. Fixture: appointment.tests.template_selam_v3_qa_fixtures (setup before, cleanup after; cleanup deletes the booking
# that the success scenario makes, by the QA client's exact email). Development-only query values: `preview-time` (Addis clock),
# `preview-availability` (off, empty) and `preview-state=loading` (the template's own loading screen).
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-selam-v3-states
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_selam_v3_qa_fixtures.browser_values
scenarios:
- id: selam_night_light
  title: 'After dark in light mode: the 5:30 am stage with the night frames'
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=20:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Good evening
  actions:
  - action: wait_for
    selector: .s3[data-night="true"]
  - action: wait_for
    selector: .s3-flow-frame:first-child img[src*="hero-night"]
  - action: screenshot
    name: selam_night_light-01-hero.png
    full_page: false
  - action: click
    selector: '#s3-band-title'
  - action: wait_for
    selector: .s3-band-photo img[src*="band-night"]
  - action: screenshot
    name: selam_night_light-02-band.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_morning
  title: 'Early morning in light mode: day photos, closed until 09:00'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=07:15
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Good morning
  actions:
  - action: wait_for
    selector: .s3-flow-frame:first-child img[src$="/hero.webp"]
  - action: wait_for
    selector: :nth-match([data-qa="selam-open-now"][data-open="false"], 1)
  - action: screenshot
    name: selam_morning-01-hero.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_availability_on
  title: Live availability on (the showcase setting)
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=16:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Next free time
  actions:
  - action: wait_for
    selector: '[data-qa="selam-next-free"]'
  - action: wait_for
    selector: '[data-qa="selam-coach-next-0"]'
  - action: click
    selector: '#s3-sessions-title'
  - action: wait_for
    selector: :nth-match(.s3-session-live, 1)
  - action: screenshot
    name: selam_availability_on-01-sessions.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_availability_off
  title: 'Live availability off: no chip, the page stays complete'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=16:30&preview-availability=off
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: '[data-qa="selam-next-free"]'
    state: detached
  - action: wait_for
    selector: '[data-qa="selam-coach-next-0"]'
    state: detached
  - action: screenshot
    name: selam_availability_off-01-hero.png
    full_page: false
  - action: click
    selector: '#s3-team-title'
  - action: screenshot
    name: selam_availability_off-02-coach.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_availability_empty
  title: 'Live availability with nothing free: no chip'
  viewport: &id002
    width: 390
    height: 844
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=16:30&preview-availability=empty
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: '[data-qa="selam-next-free"]'
    state: detached
  - action: screenshot
    name: selam_availability_empty-01-hero.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_loading
  title: The template's own loading screens (site and handoff)
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_selam_slug}?preview-state=loading&display=light
    assertions:
    - type: visible_selector
      value: '[data-qa="selam-loading"]'
  actions:
  - action: screenshot
    name: selam_loading-01-site.png
    full_page: false
  - action: open_url
    url: /{qa_selam_slug}/book?preview-state=loading&display=dark
    assertions:
    - type: visible_selector
      value: '[data-qa="selam-loading"]'
  - action: screenshot
    name: selam_loading-02-handoff-dark.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_loading_mobile
  title: Loading screen on a phone (Amharic, dark)
  viewport: *id002
  checks: []
  routes:
  - path: /{qa_selam_slug}/am?preview-state=loading&display=dark
    assertions:
    - type: visible_selector
      value: '[data-qa="selam-loading"]'
  actions:
  - action: screenshot
    name: selam_loading_mobile-01-screen.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: selam_success
  title: A guest books from the Selam landing page and sees the tempo burst
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
  actions:
  - action: click
    selector: '[data-qa="selam-hero-book"]'
  - action: wait_for
    selector: '[data-qa="selam-handoff-book"]'
  - action: click
    selector: '[data-qa="selam-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_selam_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_selam_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '#userName'
  - action: fill
    selector: '#userName'
    value: '{qa_selam_client}'
  - action: fill
    selector: '[data-qa="booking-phone"]'
    value: '{qa_selam_phone}'
  - action: fill
    selector: '[data-qa="booking-email"]'
    value: '{qa_selam_email}'
  - action: click
    selector: '[data-qa="booking-confirm"]'
  - action: wait_for
    selector: '[data-qa="booking-success"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-moment"][data-moment="tempo-burst"]'
  - action: screenshot
    name: selam_success-01-tempo-burst.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

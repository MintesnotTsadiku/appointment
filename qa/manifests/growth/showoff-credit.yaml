# Template footer credit on public sites (light). Run with fixture appointment.tests.growth_showoff_qa_fixtures.
app: appointment
base_url: http://127.0.0.146:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-showoff-credit
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.growth_showoff_qa_fixtures.browser_values
scenarios:
- id: credit_bloom_en_desktop
  title: Bloom footer credit (en, desktop, light)
  viewport: &id004
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_showoff_bloom_slug}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-pe-root]'
  actions:
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: get_text
    selector: '[data-qa="template-credit"]'
    assertions:
    - type: text_contains
      selector: '[data-qa="template-credit"]'
      value: Website by
    - type: visible_selector
      value: '[data-qa="template-credit-link"][href*="source=template_credit"]'
  - action: screenshot
    name: credit_bloom_en_desktop-footer.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors
- id: credit_bloom_am_mobile
  title: Bloom footer credit (am, mobile, light)
  viewport: &id003
    width: 390
    height: 844
  checks: []
  routes:
  - path: /{qa_showoff_bloom_slug}/am
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-pe-root]'
  actions:
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: get_text
    selector: '[data-qa="template-credit"]'
    assertions:
    - type: text_contains
      selector: '[data-qa="template-credit"]'
      value: ድረ-ገጽ በ
    - type: visible_selector
      value: '[data-qa="template-credit-link"][href*="source=template_credit"]'
  - action: screenshot
    name: credit_bloom_am_mobile-footer.png
    full_page: false
  - *id001
  - *id002

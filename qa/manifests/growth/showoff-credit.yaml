  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: scroll
    delta_y: 5000
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: get_text
    selector: '[data-qa="template-credit"]'
    assertions:
    - type: text_contains
      selector: '[data-qa="template-credit"]'

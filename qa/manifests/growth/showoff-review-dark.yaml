# Owner year in review on a phone in Amharic, dark. Run with fixture appointment.tests.growth_showoff_qa_fixtures.
app: appointment
base_url: http://localhost:47800
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-growth-showoff-review-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.growth_showoff_qa_fixtures.browser_values
scenarios:
- id: review_am_mobile_dark
  title: Owner year in review (am, mobile, dark)
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /grow
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="year-review-section"]'
  actions:
  - action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: '[data-qa="year-review-section"]:has-text("የዓመቱ ማጠቃለያ")'
  - action: click
    selector: '[data-qa="year-review-lang-am"]'
  - action: wait_for
    selector: '[data-qa="year-review-preview"]'
    assertions:
    - type: network_request
      url_contains: appointment.growth.year_review.image
      status: 200
      timeout_ms: 30000
    - type: visible_text
      value: ያገለገልናቸው ደንበኞች
  - action: scroll
    delta_y: 0
  - action: screenshot
    name: review_am_mobile-1-section.png
    full_page: true
  - action: open_url
    url: /api/method/appointment.growth.year_review.image?business=Bole%20Bloom%20Hair%20Studio&period={qa_showoff_period}&lang=am&size=story
  - action: screenshot
    name: review_am_mobile-2-story-am.png
    full_page: true
  - action: open_url
    url: /grow
  - action: wait_for
    selector: '[data-qa="topnav-language"]'
  - action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
  - action: get_console_errors
  - action: get_network_errors

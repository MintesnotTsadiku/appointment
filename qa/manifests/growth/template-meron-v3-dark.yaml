# Meron v3 "The Fitting Room" (dark, reduced motion). Fixture: appointment.tests.template_meron_v3_qa_fixtures (setup before, cleanup after).
# Navy velvet: the hero film and the booking band show their night photos in dark mode. Reduced motion shows every section at once, the film
# as one still and the review row as a still grid. The mode switch works both ways. English and Amharic, desktop and phone.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-meron-v3-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.template_meron_v3_qa_fixtures.browser_values
scenarios:
- id: meron_dark_en_desktop
  title: Meron v3 meron_dark_en_desktop (dark, reduced motion)
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_meron_slug}?display=dark&preview-time=21:00
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="meron-atelier-v3"][data-pe-recipe="meron-atelier"]'
    - type: text_contains
      value: Good evening
  actions:
  - action: wait_for
    selector: .m3-film-frame.is-on img[src*="loop1-night"]
  - action: wait_for
    selector: .m3[data-motion-level="none"]
  - action: wait_for
    selector: '[data-qa="meron-film-pause"]'
    state: detached
  - action: screenshot
    name: meron_dark_en_desktop-01-hero.png
    full_page: false
  - action: click
    selector: '#m3-tags-title'
  - action: screenshot
    name: meron_dark_en_desktop-02-tags.png
    full_page: false
  - action: click
    selector: '#m3-story-title'
  - action: screenshot
    name: meron_dark_en_desktop-03-story.png
    full_page: false
  - action: click
    selector: '#m3-looks-title'
  - action: screenshot
    name: meron_dark_en_desktop-04-lookbook.png
    full_page: false
  - action: click
    selector: '#m3-reviews-title'
  - action: wait_for
    selector: .m3-marquee-track[data-marquee="static"]
  - action: screenshot
    name: meron_dark_en_desktop-05-reviews-still.png
    full_page: false
  - action: click
    selector: '#m3-visit-title'
  - action: screenshot
    name: meron_dark_en_desktop-06-visit.png
    full_page: false
  - action: click
    selector: '#m3-band-title'
  - action: wait_for
    selector: .m3-band-photo img[src*="band-night"]
  - action: screenshot
    name: meron_dark_en_desktop-07-band-night.png
    full_page: false
  - action: click
    selector: '#m3-hero-title'
  - action: screenshot
    name: meron_dark_en_desktop-08-full.png
    full_page: true
  - action: click
    selector: '[data-qa="meron-mode"]'
    assertions:
    - type: visible_selector
      value: .m3[data-pe-mode="light"]
  - action: screenshot
    name: meron_dark_en_desktop-09-light-after-dark.png
    full_page: false
  - action: click
    selector: '[data-qa="meron-mode"]'
    assertions:
    - type: visible_selector
      value: .m3[data-pe-mode="dark"]
  - action: click
    selector: '[data-qa="meron-band-book"]'
  - action: wait_for
    selector: '[data-vt-book]'
  - action: wait_for
    selector: '[data-qa="meron-handoff-book"]'
  - action: screenshot
    name: meron_dark_en_desktop-10-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="meron-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: screenshot
    name: meron_dark_en_desktop-11-scheduler.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors

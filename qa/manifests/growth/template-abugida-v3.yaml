# Abugida v3 "Living Manuscript" (light, full motion). Fixture: appointment.tests.template_abugida_v3_qa_fixtures (setup before, cleanup after).
# Every section of /abugida-studio and /abugida-studio/am: the fidel table hero (greeting, open-now, next free time, the photo in the
# fidel window), the contents page with Ge'ez folios, the coaches, the story with its drop cap, the phrase card (turned), the steps,
# the colophon, the marginalia with the review marquee and its pause, the FAQ with the Habesha clock, the room tabs and the map, the
# booking band and the footer; then the handoff (view transition target), the service chooser and the time picker.
# `?preview-time=` fixes the Addis clock (development builds only). See docs/design/ABUGIDA_V3.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-abugida-v3
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_abugida_v3_qa_fixtures.browser_values
scenarios:
- id: abugida_en_desktop
  title: Abugida v3 (en, desktop, light, afternoon)
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_abugida_slug}?display=light&preview-time=16:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="abugida-language-v3"][data-pe-recipe="abugida-language"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: .a3-fidel-photo img
  - action: wait_for
    selector: '[data-qa="abugida-next-free"]'
  - action: wait_for
    selector: :nth-match(.a3-glyph, 26)
  - action: screenshot
    name: abugida_en_desktop-01-hero.png
    full_page: false
  - action: click
    selector: '#a3-contents-title'
  - action: wait_for
    selector: :nth-match(.a3-toc-live, 1)
  - action: screenshot
    name: abugida_en_desktop-02-contents.png
    full_page: false
  - action: click
    selector: '#a3-team-title'
  - action: screenshot
    name: abugida_en_desktop-03-coaches.png
    full_page: false
  - action: click
    selector: '#a3-story-title'
  - action: screenshot
    name: abugida_en_desktop-04-story.png
    full_page: false
  - action: click
    selector: '#a3-glosses-title'
  - action: click
    selector: '[data-qa="abugida-phrase-turn"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="abugida-phrase"][data-turned="true"]'
  - action: wait_for
    selector: :nth-match(.a3-gloss-list li, 3)
  - action: screenshot
    name: abugida_en_desktop-05-phrase-turned.png
    full_page: false
  - action: click
    selector: '#a3-steps-title'
  - action: screenshot
    name: abugida_en_desktop-06-steps.png
    full_page: false
  - action: click
    selector: :nth-match(.a3-proof-label, 1)
  - action: screenshot
    name: abugida_en_desktop-07-colophon.png
    full_page: false
  - action: click
    selector: '#a3-reviews-title'
  - action: click
    selector: '[data-qa="abugida-reviews-pause"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="abugida-reviews-pause"][aria-pressed="true"]'
  - action: screenshot
    name: abugida_en_desktop-08-marginalia-paused.png
    full_page: false
  - action: click
    selector: '#a3-faq-title'
  - action: click
    selector: :nth-match(.a3-faq-list summary, 1)
  - action: click
    selector: '[data-qa="abugida-habesha-toggle"]'
    assertions:
    - type: text_contains
      selector: .a3-hours
      value: ከጠዋቱ 4 ሰዓት
  - action: screenshot
    name: abugida_en_desktop-09-faq-hours.png
    full_page: false
  - action: click
    selector: '#a3-visit-title'
  - action: click
    selector: '[data-qa="abugida-room-tab-1"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="abugida-room-tab-1"][aria-selected="true"]'
  - action: wait_for
    selector: .a3-map
  - action: screenshot
    name: abugida_en_desktop-10-visit.png
    full_page: false
  - action: click
    selector: '#a3-band-title'
  - action: screenshot
    name: abugida_en_desktop-11-band.png
    full_page: false
  - action: click
    selector: .a3-footer-name
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: screenshot
    name: abugida_en_desktop-12-footer.png
    full_page: false
  - action: click
    selector: '#a3-hero-title'
  - action: screenshot
    name: abugida_en_desktop-13-full.png
    full_page: true
  - action: click
    selector: '[data-qa="abugida-hero-book"]'
  - action: wait_for
    selector: '[data-vt-book]'
  - action: wait_for
    selector: '[data-qa="abugida-handoff-service-0"]'
  - action: screenshot
    name: abugida_en_desktop-14-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="abugida-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: screenshot
    name: abugida_en_desktop-15-chooser.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_abugida_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_abugida_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: screenshot
    name: abugida_en_desktop-16-time-picker.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors

# Seeder-owned showcase; includes deterministic loading and holiday previews.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/meseret-states
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  show_cursor: false
  show_action_labels: false
  color_scheme: light
scenarios:
- id: meseret_en_1440-states
  title: meseret_en_1440-states
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /meseret-studio?display=light&preview-time=10:00&preview-holiday=meskel
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="meseret-advisory-v3"][lang="en"]'
  actions:
  - action: wait_for
    selector: '[data-qa="holiday-moment"]'
  - action: click
    selector: '[data-qa="meseret-mode"]'
  - action: screenshot
    name: meseret_en_1440-states-hero.png
    full_page: false
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: screenshot
    name: meseret_en_1440-states-full.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

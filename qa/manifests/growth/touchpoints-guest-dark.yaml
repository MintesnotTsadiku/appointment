# Growth touchpoints (am, dark). Run with fixture appointment.tests.growth_touchpoints_qa_fixtures.
# Guests book at Bloom, see Powered by and the business prompt; returning customer sees Book again; email previews.
# The one-tap setup stops at the prefilled form; no business is created.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-touchpoints-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.growth_touchpoints_qa_fixtures.browser_values
scenarios:
- id: tp_am_mobile_confirm
  title: 'Guest books at Bloom in Amharic: Powered by and the business prompt; dismiss hides it (am, mobile, dark)'
  viewport: &id001
    width: 390
    height: 844
  checks: []
  routes:
  - path: /
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="language-toggle"]'
  actions:
  - action: press
    selector: '[data-qa="language-toggle"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation.messages
      status: 200
  - action: open_url
    url: /schedule/org/{qa_touch_slug}
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '#userName'
  - action: fill
    selector: '#userName'
    value: Dawit Alemu
  - action: fill
    selector: '#userEmail'
    value: '{qa_touch_guest_3}'
  - action: click
    selector: '[data-qa="booking-confirm"]'
    assertions:
    - type: network_request
      url_contains: book_time_slot
      method: POST
      status_min: 200
      status_max: 299
      timeout_ms: 25000
    - type: visible_selector
      value: '[data-qa="booking-success"]'
    - type: network_request
      url_contains: business_prompt.prompt
      status: 200
      timeout_ms: 15000
    - type: visible_selector
      value: '[data-qa="business-prompt"]'
    - type: visible_selector
      value: '[data-booking-confirmation] [data-qa="powered-by"]'
    # Amharic: the zone in Amharic and the time on the Ethiopian clock with its period.
    - type: text_contains
      selector: '[data-qa="booking-confirmation-zone"]'
      value: የአዲስ አበባ ሰዓት
    - type: text_contains
      selector: '[data-qa="booking-confirmation-time"]'
      value: 'ሰዓት '
    - type: visible_selector
      value: '[data-qa="booking-confirmation-time"]:is(:has-text("ጠዋት"), :has-text("ከሰዓት"), :has-text("ምሽት"), :has-text("ሌሊት"))'
  - action: wait_for
    selector: '[data-qa="business-prompt"]'
    assertions:
    - type: visible_text
      value: እርስዎም ቀጠሮ ይቀበላሉ?
  - action: screenshot
    name: tp_am_mobile-1-confirmation.png
    full_page: true
  - action: press
    selector: '[data-qa="business-prompt-start"]'
    key: Shift
  - action: screenshot
    name: tp_am_mobile-1b-confirmation-growth.png
  - action: click
    selector: '[data-qa="business-prompt-dismiss"]'
  - action: wait_for
    selector: '[data-qa="business-prompt"]'
    state: hidden
  - action: screenshot
    name: tp_am_mobile-2-dismissed.png
    full_page: true
  - &id002
    action: get_console_errors
  - &id003
    action: get_network_errors
- id: tp_am_mobile_returning
  title: My bookings Book again and the manage page mark (am, mobile, dark)
  viewport: *id001
  checks: []
  routes:
  - path: /
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="language-toggle"]'
  actions:
  - action: press
    selector: '[data-qa="language-toggle"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation.messages
      status: 200
  - action: open_url
    url: '{qa_touch_mine_link_2}'
  - action: wait_for
    selector: '[data-qa="my-bookings-list"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="my-bookings-past"] [data-qa="my-booking-book-again"]'
    - type: visible_selector
      value: '[data-qa="my-bookings"] [data-qa="powered-by"]'
  - action: screenshot
    name: tp_am_mobile-mine.png
    full_page: true
  - action: open_url
    url: '{qa_touch_manage_path}'
  - action: wait_for
    selector: '[data-qa="manage-booking"] [data-qa="powered-by"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="manage-all-bookings"]'
    - type: visible_selector
      value: '[data-qa="powered-by-cta"]'
  - action: screenshot
    name: tp_am_mobile-manage.png
    full_page: true
  - *id002
  - *id003
- id: tp_am_emails
  title: Amharic confirmation and reminder emails (mobile)
  viewport: *id001
  checks: []
  routes:
  - path: /
    assertions:
    - type: network_idle
  actions:
  - action: open_url
    url: '{qa_touch_email_confirmation_am}'
  - action: wait_for
    selector: a[href*="source=powered_by_email"]
    assertions:
    - type: visible_text
      value: የራስዎን የቀጠሮ ገጽ
    - type: visible_selector
      value: a[href*="/schedule/org/"]
  - action: screenshot
    name: tp_am-email-confirmation.png
    full_page: true
  - action: open_url
    url: '{qa_touch_email_reminder_am}'
  - action: wait_for
    selector: a[href*="source=powered_by_email"]
    assertions:
    - type: visible_text
      value: የራስዎን የቀጠሮ ገጽ
    - type: visible_selector
      value: a[href*="/schedule/org/"]
  - action: screenshot
    name: tp_am-email-reminder.png
    full_page: true
  - *id002
  - *id003

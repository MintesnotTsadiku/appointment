# Ethiopian holiday moments (addition A7) in every v3 template and Ergata v2, with the development-only
# `?preview-holiday=<key>` override, in en (desktop) and am (phone). Also the real date logic (`preview-date`), and no
# moment on an ordinary day. The showcases have the owner switch on. Fixture: none (public pages; books nothing).
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-holiday-moments
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
scenarios:
- id: holiday_bloom_en_desktop
  title: 'bloom: enkutatash (en, desktop, light)'
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /bloom-studio?display=light&preview-holiday=enkutatash
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"]'
  actions:
  - action: wait_for
    selector: '[data-qa="holiday-moment"][data-holiday="enkutatash"]:has-text("Melkam Addis Amet")'
  - action: wait_for
    selector: '[data-qa="holiday-moment"] [lang="am"]:has-text("መልካም አዲስ ዓመት")'
  - action: screenshot
    name: holiday_bloom_en_desktop-1-enkutatash.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors
- id: holiday_bloom_am_mobile
  title: 'bloom: meskel (am, phone, dark)'
  viewport: &id004
    width: 390
    height: 844
  checks: []
  routes:
  - path: /bloom-studio/am?display=dark&preview-holiday=meskel
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-mode="dark"]'
  actions:
  - action: wait_for
    selector: '[data-qa="holiday-moment"][data-holiday="meskel"]:has-text("መልካም የመስቀል በዓል")'
  - action: screenshot
    name: holiday_bloom_am_mobile-1-meskel.png
    full_page: false
  - *id001
  - *id002
  options:
    color_scheme: dark

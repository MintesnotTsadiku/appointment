# Ergata v2 states: the lamp-lit room after dark in light mode, the morning, live availability on/off/empty,
# the loading screens and the handoff. Fixture: appointment.tests.template_ergata_v2_qa_fixtures (setup before; books nothing).
# Development-only query values: `preview-time`, `preview-availability`, `preview-state=loading`.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-ergata-v2-states
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_ergata_v2_qa_fixtures.browser_values
scenarios:
- id: ergata_v2_night_light
  title: 'After dark in light mode: night photos, evening greeting'
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_ergata_slug}?display=light&preview-time=20:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
    - type: text_contains
      value: Good evening
  actions:
  - action: wait_for
    selector: .eg2-hero-photo img[src*="hero-night"]
  - action: wait_for
    selector: '[data-template="ergata-therapy-v2"][data-night="true"]'
  - action: screenshot
    name: ergata_v2_night_light-1-hero.png
    full_page: false
  - action: click
    selector: '#eg2-band-title'
  - action: wait_for
    selector: .eg2-band-window img[src*="band-night"]
  - action: screenshot
    name: ergata_v2_night_light-2-band.png
    full_page: false
  - &id002
    action: get_console_errors
  - &id003
    action: get_network_errors
- id: ergata_v2_morning
  title: 'Morning in light mode: day photos, closed until 09:00'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}?display=light&preview-time=07:15
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
    - type: text_contains
      value: Good morning
  actions:
  - action: wait_for
    selector: .eg2-hero-photo img[src$="/hero.webp"]
  - action: click
    selector: '#eg2-visit-title'
  - action: wait_for
    selector: :nth-match([data-qa="ergata-open-now"][data-open="false"], 1)
  - action: screenshot
    name: ergata_v2_morning-1-places.png
    full_page: false
  - *id002
  - *id003
- id: ergata_v2_availability_off
  title: 'Live availability off: no next free lines'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}?display=light&preview-availability=off
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
  actions:
  - action: wait_for
    selector: '[data-qa="ergata-next-free"]'
    state: detached
  - action: wait_for
    selector: '[data-qa="ergata-session-next-0"]'
    state: detached
  - action: screenshot
    name: ergata_v2_availability_off-1-hero.png
    full_page: false
  - *id002
  - *id003
- id: ergata_v2_availability_empty
  title: 'Live availability with nothing free: no next free lines'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}?display=light&preview-availability=empty
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
  actions:
  - action: wait_for
    selector: '[data-qa="ergata-next-free"]'
    state: detached
  - action: screenshot
    name: ergata_v2_availability_empty-1-hero.png
    full_page: false
  - *id002
  - *id003
- id: ergata_v2_loading
  title: The template's own loading screen (site light, handoff dark)
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}?preview-state=loading&display=light
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-qa="ergata-loading"]'
  actions:
  - action: screenshot
    name: ergata_v2_loading-1-site.png
    full_page: false
  - action: open_url
    url: /{qa_ergata_slug}/book?preview-state=loading&display=dark
    assertions:
    - type: visible_selector
      value: '[data-qa="ergata-loading"]'
  - action: screenshot
    name: ergata_v2_loading-2-handoff-dark.png
    full_page: false
  - *id002
  - *id003
- id: ergata_v2_loading_am_mobile
  title: Loading screen (am, phone, dark)
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /{qa_ergata_slug}/am?preview-state=loading&display=dark
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-qa="ergata-loading"]'
  actions:
  - action: screenshot
    name: ergata_v2_loading_am_mobile-1.png
    full_page: false
  - *id002
  - *id003
- id: ergata_v2_handoff
  title: 'The /book handoff: the window, the next free call and one link per session'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}/book?display=light
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-pe-booking][data-template="ergata-therapy-v2"]'
    - type: text_contains
      value: When you feel ready
  actions:
  - action: wait_for
    selector: '[data-qa="ergata-handoff-next"]'
  - action: wait_for
    selector: :nth-match([data-qa^="ergata-handoff-session-"][href^="/schedule/p/{qa_ergata_slug}/"], 6)
  - action: screenshot
    name: ergata_v2_handoff-1.png
    full_page: true
  - *id002
  - *id003

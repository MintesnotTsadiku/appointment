# Brand & growth page, platform administrator, light. Run with fixture
# appointment.tests.growth_foundation_qa_fixtures (setup records the settings, cleanup saves them back).
# The scenario renames the product, sees the preview and the saved value, then restores the original name.
# Dark mobile: foundation-brand-dark.yaml. Guest "Powered by": foundation-brand-guest.yaml.
app: appointment
base_url: http://127.0.0.146:47800
default_role: Administrator
auth:
  type: frappe_session
  username: Administrator
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-growth-foundation
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.growth_foundation_qa_fixtures.browser_values
scenarios:
- id: brand_en_desktop_light
  title: Brand & growth, rename and restore (en, desktop, light)
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /admin/brand
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="nav-admin-brand"]'
    - type: visible_selector
      value: '[data-qa="brand-preview-powered-by"] [data-qa="powered-by"]'
    - type: visible_text
      value: Brand & growth
  actions:
  - action: wait_for
    selector: '[data-qa="brand-product-name"]'
  - action: screenshot
    name: brand_en_desktop-1-brand.png
    full_page: true
  - action: fill
    selector: '[data-qa="brand-product-name"]'
    value: '{qa_brand_test_name}'
  - action: wait_for
    selector: '[data-qa="brand-preview-name"]:has-text("{qa_brand_test_name}")'
    assertions:
    - type: visible_selector
      value: '[data-qa="powered-by-product"]:has-text("{qa_brand_test_name}")'
  - action: screenshot
    name: brand_en_desktop-2-preview.png
    full_page: false
  - action: click
    selector: '[data-qa="brand-growth-save"]'
    assertions:
    - type: network_request
      url_contains: appointment.growth.api.save_settings
      status: 200
    - type: visible_text
      value: Brand and growth settings saved.
  - action: click
    selector: '[data-qa="brand-growth-tab-growth"]'
  - action: wait_for
    selector: '[data-qa="growth-powered-by-pages"]'
    assertions:
    - type: visible_text
      value: Customer touchpoints
  - action: screenshot
    name: brand_en_desktop-3-growth.png
    full_page: true
  - action: click
    selector: '[data-qa="brand-growth-tab-brand"]'
  - action: fill
    selector: '[data-qa="brand-product-name"]'
    value: '{qa_brand_product_name}'
  - action: click
    selector: '[data-qa="brand-growth-save"]'
    assertions:
    - type: network_request
      url_contains: appointment.growth.api.save_settings
      status: 200
  - action: wait_for
    selector: '[data-qa="brand-preview-name"]:text-is("{qa_brand_product_name}")'
  - action: get_console_errors
  - action: get_network_errors

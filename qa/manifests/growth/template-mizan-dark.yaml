# Uses the idempotent showcase seeder.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/mizan-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: dark
scenarios:
- id: mizan_en_1440-dark
  title: mizan_en_1440-dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /mizan-studio?display=dark&preview-time=10:00
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="mizan-inspection-v3"][lang="en"]'
  actions:
  - action: screenshot
    name: mizan_en_1440-dark-hero.png
    full_page: false
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: screenshot
    name: mizan_en_1440-dark-full.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

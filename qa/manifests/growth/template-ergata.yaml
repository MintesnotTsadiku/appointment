# Ergata Therapy template (light, public page and booking flow). Fixture: appointment.tests.template_ergata_qa_fixtures (setup before, cleanup after).
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-ergata
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_ergata_qa_fixtures.browser_values
scenarios:
- id: ergata_en_desktop_light
  title: Ergata public page (en, desktop, light)
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_ergata_slug}
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
    - type: text_contains
      value: A calm space to talk
  actions:
  - action: screenshot
    name: ergata_en_desktop_light-1-hero.png
    full_page: false
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: scroll
    delta_y: 1400
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: get_text
    selector: '[data-qa="ergata-notice"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="ergata-notice-call"][href="tel:991"]'
    - type: visible_selector
      value: '[data-qa="template-credit-link"][href*="source=template_credit"]'
    - type: visible_selector
      value: '[data-qa="ergata-place-office"]'
    - type: visible_selector
      value: '[data-qa="ergata-place-online"]'
    - type: visible_selector
      value: '[data-qa="ergata-session-book"][data-meet="online"][href^="/schedule/p/{qa_ergata_slug}/"]'
    - type: visible_selector
      value: '[data-qa="ergata-session-book"][data-meet="in_person"][href^="/schedule/p/{qa_ergata_slug}/"]'
  - action: screenshot
    name: ergata_en_desktop_light-2-full.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="ergata-faq-item"] summary, 2)
  - action: scroll
    selector: '[data-qa="ergata-notice"]'
  - action: screenshot
    name: ergata_en_desktop_light-3-faq-notice.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

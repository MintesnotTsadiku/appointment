- id: ergata_book_en_desktop_light
  title: 'Ergata booking: landing to the time picker (en, desktop, light)'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_ergata_slug}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="ergata-hero-book"]'
  actions:
  - action: click
    selector: '[data-qa="ergata-hero-book"]'
  - action: wait_for
    selector: '[data-pe-booking][data-template="ergata-therapy-v2"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="ergata-handoff-book"][href^="/schedule/p/{qa_ergata_slug}/"]'
    - type: text_contains
      value: When you feel ready
  - action: screenshot
    name: ergata_book_en_desktop_light-1-handoff.png
    full_page: true
  - action: click
    selector: '[data-qa="ergata-handoff-book"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-service"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: '[data-qa="booking-slots"]'
  - action: screenshot
    name: ergata_book_en_desktop_light-2-time-picker.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

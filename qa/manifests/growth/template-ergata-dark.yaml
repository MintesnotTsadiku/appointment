- id: ergata_book_en_mobile_dark
  title: 'Ergata booking: landing to the time picker (en, mobile, dark)'
  viewport: *id002
  checks: []
  routes:
  - path: /{qa_ergata_slug}
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="ergata-hero-book"]'
  actions:
  - action: click
    selector: '[data-qa="ergata-hero-book"]'
  - action: wait_for
    selector: '[data-pe-booking][data-template="ergata-therapy-v2"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="ergata-handoff-book"][href^="/schedule/p/{qa_ergata_slug}/"]'
    - type: text_contains
      value: When you feel ready
  - action: screenshot
    name: ergata_book_en_mobile_dark-1-handoff.png
    full_page: true
  - action: click
    selector: '[data-qa="ergata-handoff-book"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-service"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: '[data-qa="booking-slots"]'
  - action: screenshot
    name: ergata_book_en_mobile_dark-2-time-picker.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

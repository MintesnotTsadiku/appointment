# Selam v3 "Tempo" (light, full motion). Fixture: appointment.tests.template_selam_v3_qa_fixtures (setup before, cleanup after).
# Every section of /selam-studio and /selam-studio/am: hero (greeting, open-now, next free time), one movement in five frames (desktop: the
# pinned scroll scrub with the drawn arc; phone: the swipe rail with dots), sessions with tempo numerals and pace bars, the Entoto story,
# the coach, the session beats, proof, benefits bento, pull quote and review marquee with pause, FAQ with the Habesha clock, visit, booking
# band, footer; then the booking handoff (view transition target) and the scheduler time picker. `?preview-time=` fixes the Addis clock
# (development builds only). Agent Plane `scroll` ignores `selector`: a heading click brings each section into view. See docs/design/SELAM_V3.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-selam-v3
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_selam_v3_qa_fixtures.browser_values
scenarios:
- id: selam_en_desktop
  title: Selam v3 (en, desktop, light, afternoon)
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_selam_slug}?display=light&preview-time=16:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="selam-movement-v3"][data-pe-recipe="selam-movement"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: .s3-flow-frame:first-child img
  - action: wait_for
    selector: '[data-qa="selam-next-free"]'

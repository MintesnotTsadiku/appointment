# Amharic names on the showcases: the website team section and name, the service chooser (business name, provider chips
# and avatars), the time picker (provider options), the booking summary (provider and place) and bar, the Bloom details step and confirmation,
# and the provider pages. Fixtures, in order: appointment.tests.provider_page_qa_fixtures.setup (Rahel Girma's page; never
# run its cleanup), appointment.tests.template_bloom_v3_qa_fixtures.setup, appointment.tests.amharic_names_qa_fixtures.setup;
# after the run: appointment.tests.template_bloom_v3_qa_fixtures.cleanup (the Bloom QA client's booking).
# See docs/operations/content-showcases.md, "Amharic names".
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-amharic-names
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 300000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.amharic_names_qa_fixtures.browser_values
scenarios:
- id: names_bloom_am_desktop_light
  title: 'Bloom in Amharic: website team, chooser, time picker, summary'
  viewport:
    width: 1440
    height: 900
  options:
    color_scheme: light
  checks: []
  routes:
  - path: /bloom-studio/am?display=light
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: wait_for
    selector: body:has-text("ቦሌ ብሉም የፀጉር ስቱዲዮ")
  - action: screenshot
    name: names_bloom_am_desktop_light-1-landing.png
    full_page: false
  - action: click
    selector: '[id$="-team-title"]'
  - action: wait_for
    selector: section:has([id$="-team-title"]):has-text("ሐና ተስፋዬ")
  - action: screenshot
    name: names_bloom_am_desktop_light-2-team.png
    full_page: false
  - action: open_url
    url: /schedule/org/bloom-studio?lang=am
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
    timeout_ms: 20000
    assertions:
    - type: text_contains
      selector: '[data-qa="booking-business"]'
      value: ቦሌ ብሉም የፀጉር ስቱዲዮ
    - type: text_contains
      selector: '[data-qa="booking-header"]'
      value: ቦሌ ብሉም የፀጉር ስቱዲዮ
  - action: wait_for
    selector: '[data-qa="booking-provider"]:has-text("ሐና ተስፋዬ")'
  - action: wait_for
    selector: '[data-qa="booking-provider"]:has-text("ራሔል ግርማ")'
  - action: wait_for
    selector: '[data-qa="booking-provider"]:has-text("ኤደን ታደሰ")'
  - action: screenshot
    name: names_bloom_am_desktop_light-3-chooser.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="time"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-provider-option"]:has-text("ሐና ተስፋዬ")'
  - action: wait_for
    selector: '[data-qa="booking-provider-option"]:has-text("ራሔል ግርማ")'
  - action: wait_for
    selector: '[data-qa="booking-provider-option"]:has-text("ኤደን ታደሰ")'
  - action: click
    selector: '[data-qa="booking-provider-option"]:has-text("ሐና ተስፋዬ")'
  - action: wait_for
    selector: '[data-qa="booking-provider-option"][aria-pressed="true"]:has-text("ሐና ተስፋዬ")'
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_names_bloom_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_names_bloom_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
  - action: wait_for
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: body:has-text("ከሐና ተስፋዬ ጋር")
  - action: wait_for
    selector: '[data-qa="booking-summary"]:has-text("ሐና ተስፋዬ")'
  # The place in Amharic (Location.location_name_am, seeded).
  - action: wait_for
    selector: '[data-qa="booking-summary-place"]:has-text("የቦሌ")'
  - action: screenshot
    name: names_bloom_am_desktop_light-4-time-picker.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '#userName'
  - action: wait_for
    selector: body:has-text("ሐና ተስፋዬ")
  - action: screenshot
    name: names_bloom_am_desktop_light-5-details.png
    full_page: false
  - action: fill
    selector: '#userName'
    value: '{qa_bloom_client}'
  - action: fill
    selector: '[data-qa="booking-phone"]'
    value: '{qa_bloom_phone}'
  - action: click
    selector: '[data-qa="booking-confirm"]'
  - action: wait_for
    selector: '[data-qa="booking-success"]'
    timeout_ms: 20000
  - action: wait_for
    selector: body:has-text("ሐና ተስፋዬ")
  - action: screenshot
    name: names_bloom_am_desktop_light-6-confirmation.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

  - action: wait_for
    selector: '[data-qa="booking-picker"][data-wide="false"] [data-qa="booking-strip"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: screenshot
    name: layout_selam_en_mobile-2-picker.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: scroll
    delta_y: 600
  - action: wait_for
    selector: '[data-qa="booking-bar"] [data-qa="booking-continue"]'
  - action: screenshot
    name: layout_selam_en_mobile-3-scrolled-bar.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-calendar-toggle"]'
  - action: wait_for

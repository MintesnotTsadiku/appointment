# Seeder-owned Hana. Booking journey fixture setup: appointment.tests.template_collection_qa_fixtures.setup.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/hana
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
  show_action_labels: false
  show_cursor: false
scenarios:
- id: hana_en_1440
  title: hana_en_1440
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /hana-bekele?display=light&preview-time=10:00
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="hana-conversations-v3"][lang="en"]'
  actions:
  - action: screenshot
    name: hana_en_1440-hero.png
    full_page: false
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: scroll
    delta_y: 850
  - action: screenshot
    name: hana_en_1440-full.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

# Owner year in review from Insights and the Grow page (en, desktop, light). Run with fixture appointment.tests.growth_showoff_qa_fixtures.
app: appointment
base_url: http://127.0.0.146:47800
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-growth-showoff-review
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.growth_showoff_qa_fixtures.browser_values
scenarios:
- id: review_en_desktop
  title: Owner year in review and Insights entry point (en, desktop, light)
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="insights-year-review"]'
  actions:
  - action: screenshot
    name: review_en_desktop-1-insights.png
    full_page: false
  - action: click
    selector: '[data-qa="insights-year-review-open"]'
    assertions:
    - type: url_contains
      value: /grow
  - action: wait_for
    selector: '[data-qa="year-review-stats"]'
    timeout_ms: 30000
  - action: wait_for
    selector: '[data-qa="year-review-preview"]'
    assertions:
    - &id001
      type: network_request
      url_contains: appointment.growth.year_review.image
      status: 200
      timeout_ms: 30000
    - type: visible_selector
      value: '[data-qa="year-review-stat-clients"]'
    - type: visible_selector
      value: '[data-qa="year-review-download"][href*="lang=en"]'
  - action: scroll
    delta_y: 0
  - action: screenshot
    name: review_en_desktop-2-section.png
    full_page: true
  - action: click
    selector: '[data-qa="year-review-size-story"]'
    assertions:
    - *id001
  - action: click
    selector: '[data-qa="year-review-period"]'
  - action: wait_for
    selector: '[role="option"]'
  - action: screenshot
    name: review_en_desktop-3-periods.png
    full_page: false
  - action: press
    selector: '[role="option"]'
    key: Escape
  - action: click
    selector: '[data-qa="year-review-lang-am"]'
    assertions:
    - *id001
    - type: visible_selector
      value: '[data-qa="year-review-download"][href*="lang=am"]'
  - action: screenshot
    name: review_en_desktop-4-story-am.png
    full_page: true
  - action: open_url
    url: /api/method/appointment.growth.year_review.image?business=Bole%20Bloom%20Hair%20Studio&period={qa_showoff_period}&lang=am&size=portrait
  - action: screenshot
    name: review_en_desktop-5-image-am.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

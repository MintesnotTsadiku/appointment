# Abugida v3 "Living Manuscript" (dark, reduced motion). Fixture: appointment.tests.template_abugida_v3_qa_fixtures (setup before, cleanup after).
# A candle-lit study: the hero and the booking band show their night photos in dark mode. Reduced motion shows every section at once,
# the phrase card turns without movement and the review notes are a still grid. The mode switch works both ways. English and Amharic,
# desktop and phone.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-abugida-v3-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.template_abugida_v3_qa_fixtures.browser_values
scenarios:
- id: abugida_dark_en_desktop
  title: Abugida v3 (en, desktop, dark, reduced motion)
  viewport: &id003
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_abugida_slug}?display=dark&preview-time=21:00
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="abugida-language-v3"][data-pe-recipe="abugida-language"]'
    - type: text_contains
      value: Good evening
  actions:
  - action: wait_for
    selector: .a3-fidel-photo img[src*="hero-night"]
  - action: wait_for
    selector: .a3[data-motion-level="none"]
  - action: screenshot
    name: abugida_dark_en_desktop-01-hero.png
    full_page: false
  - action: click
    selector: '#a3-glosses-title'
  - action: click
    selector: '[data-qa="abugida-phrase-turn"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="abugida-phrase"][data-turned="true"]'
  - action: screenshot
    name: abugida_dark_en_desktop-02-phrase.png
    full_page: false
  - action: click
    selector: '#a3-reviews-title'
  - action: wait_for
    selector: .a3-notes-track[data-marquee="static"]
  - action: screenshot
    name: abugida_dark_en_desktop-03-marginalia-still.png
    full_page: false
  - action: click
    selector: '#a3-band-title'
  - action: wait_for
    selector: .a3-band-photo img[src*="band-night"]
  - action: screenshot
    name: abugida_dark_en_desktop-04-band-night.png
    full_page: false
  - action: click
    selector: '#a3-hero-title'
  - action: screenshot
    name: abugida_dark_en_desktop-05-full.png
    full_page: true
  - action: click
    selector: '[data-qa="abugida-mode"]'
    assertions:
    - type: visible_selector
      value: .a3[data-pe-mode="light"]
  - action: screenshot
    name: abugida_dark_en_desktop-06-light-after-dark.png
    full_page: false
  - action: click
    selector: '[data-qa="abugida-mode"]'
    assertions:
    - type: visible_selector
      value: .a3[data-pe-mode="dark"]
  - action: click
    selector: '[data-qa="abugida-band-book"]'
  - action: wait_for
    selector: '[data-vt-book]'
  - action: screenshot
    name: abugida_dark_en_desktop-07-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="abugida-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: screenshot
    name: abugida_dark_en_desktop-08-chooser.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors

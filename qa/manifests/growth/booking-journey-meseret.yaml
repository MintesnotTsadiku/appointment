# Fixture: appointment.tests.template_collection_qa_fixtures; setup before collection, cleanup after.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/meseret-journey
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
scenarios:
- id: meseret_journey
  title: meseret landing to appointment details
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /meseret-studio?display=light
    assertions:
    - type: network_idle
  actions:
  - action: click
    selector: '[data-qa="meseret-book"] >> nth=0'
  - action: wait_for
    selector: '[data-pe-booking]'
  - action: screenshot
    name: meseret-handoff.png
    full_page: true
  - action: click
    selector: '[data-qa="meseret-service-0"]'
  - action: wait_for
    selector: '[data-qa="independent-booking"][data-bk-skin="meseret-v3"]'
    timeout_ms: 20000
  - action: screenshot
    name: meseret-scheduler.png
    full_page: true
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="details"]'
  - action: screenshot
    name: meseret-details.png
    full_page: true
  - action: fill
    selector: '[data-qa="independent-booking-name"]'
    value: '{qa_collection_client}'
  - action: fill
    selector: '[data-qa="independent-booking-phone"]'
    value: '{qa_meseret_phone}'
  - action: click
    selector: '[data-qa="independent-booking-submit"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-confirmed"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-moment"]'
  - action: screenshot
    name: meseret-confirmed.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: meseret_am_journey
  title: meseret Amharic handoff and scheduler
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /meseret-studio/am?display=dark
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-pe-root][lang="am"]'
  actions:
  - action: click
    selector: '[data-qa="meseret-book"] >> nth=0'
  - action: wait_for
    selector: '[data-pe-booking][lang="am"]'
  - action: screenshot
    name: meseret-am-handoff.png
    full_page: true
  - action: click
    selector: '[data-qa="meseret-service-0"]'
  - action: wait_for
    selector: '[data-qa="independent-booking"][data-bk-skin="meseret-v3"]'
  - action: screenshot
    name: meseret-am-scheduler.png
    full_page: true
fixtures:
  provider: appointment.tests.template_collection_qa_fixtures.browser_values

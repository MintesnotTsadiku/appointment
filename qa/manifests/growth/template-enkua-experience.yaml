app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /home/minte/template-new/evidence/enkua-experience
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
scenarios:
- id: enkua-loading-en-light-390
  title: enkua-loading-en-light-390
  viewport:
    width: 390
    height: 900
  checks: []
  routes:
  - path: /enkua-studio?display=light&preview-state=loading
    assertions:
    - type: network_idle
    - type: visible_selector
      value: .enkua3-loading-composition
  actions:
  - action: screenshot
    name: enkua-loading-en-light-390.png
    full_page: false
- id: enkua-booking-en-light-390
  title: enkua-booking-en-light-390
  viewport:
    width: 390
    height: 900
  checks: []
  routes:
  - path: /enkua-studio?display=light
    assertions:
    - type: network_idle
  actions:
  - action: click
    selector: '[data-qa="enkua-service-0"]'
  - action: wait_for
    selector: '[data-qa="independent-booking"][data-bk-skin="enkua-v3"]'
    timeout_ms: 20000
  - action: screenshot
    name: enkua-booking-en-light-390.png
    full_page: true

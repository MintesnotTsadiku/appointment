# Provider page in Amharic on a phone, dark: hero with the Amharic bio, language chips, format chooser stacked, a service opens its
# scheduler with "Back to all services". Fixture: appointment.tests.provider_page_qa_fixtures.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/pp-am-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.provider_page_qa_fixtures.browser_values
scenarios:
- id: provider_page_am_mobile_dark
  title: 'Guest: provider page in Amharic (am, phone, dark)'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /schedule/p/{qa_provider_slug}?lang=am
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="provider-page-name"]'
  actions:
  - action: wait_for
    selector: '[data-qa="language-current"]:has-text("አማ")'
  - action: get_text
    selector: '[data-qa="provider-page"]'
    assertions:
    - type: text_contains
      value: አገልግሎቶች
    - type: text_contains
      value: ክፍት ሰዓቶችን ይመልከቱ
    - type: text_contains
      value: እንዴት መገናኘት ይፈልጋሉ?
  - action: get_text
    selector: '[data-qa="provider-page-bio"][lang="am"]'
    assertions:
    - type: text_contains
      value: የተመዘገበች የሥነ-ምግብ ባለሙያ
  - action: screenshot
    name: provider_page_am_mobile_dark-1-top.png
    full_page: false
  - action: screenshot
    name: provider_page_am_mobile_dark-2-full.png
    full_page: true
  - action: click
    selector: '[data-service="{qa_provider_office_service}"] [data-qa="provider-service-book"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-all-services"]'
    assertions:
    - type: text_contains
      value: ወደ ሁሉም አገልግሎቶች ይመለሱ
  - action: screenshot
    name: provider_page_am_mobile_dark-3-scheduler.png
    full_page: false
  - action: click
    selector: '[data-qa="independent-booking-all-services"]'
  - action: wait_for
    selector: '[data-qa="provider-page-name"]'
    assertions:
    - type: url_contains
      value: /schedule/p/{qa_provider_slug}
  - action: get_console_errors
  - action: get_network_errors

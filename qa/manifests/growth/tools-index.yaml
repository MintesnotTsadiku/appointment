      value: Free tools for Ethiopian businesses
    - type: visible_selector
      value: '[data-qa="tools-index-list"]'
    - type: visible_selector
      value: '[data-qa="tool-cta"]'
    - type: visible_selector
      value: '[data-qa="tools-index-ethiopian-time-converter"]'
    - type: visible_selector
      value: '[data-qa="tools-index-ethiopian-calendar-converter"]'
    - type: visible_selector
      value: '[data-qa="tools-index-amharic-appointment-reminder"]'
    - type: visible_selector
      value: '[data-qa="tools-index-business-hours-sign"]'
  actions:
  - action: screenshot
    name: index_en_mobile_light-1-open.png
    full_page: true

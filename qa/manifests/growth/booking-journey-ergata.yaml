# The Ergata booking journey as one product: landing -> /book handoff (a session row) -> the time picker in the
# Ergata skin (steps, the place's photo in an arch) -> details (phone first) -> confirmation with the calm glow.
# Fixture: appointment.tests.template_ergata_v2_qa_fixtures (setup before, cleanup after; cleanup deletes the bookings
# of the QA client by exact phone and name). See docs/design/ERGATA_V2.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-booking-journey-ergata
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 240000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_ergata_v2_qa_fixtures.browser_values
scenarios:
- id: journey_en_desktop_light
  title: 'English, desktop, light: office session to the confirmation'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_ergata_slug}?display=light
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-recipe="ergata-therapy"]'
  actions:
  - action: screenshot
    name: journey_en-1-landing.png
    full_page: false
  - action: click
    selector: '[data-qa="ergata-hero-book"]'
  - action: wait_for
    selector: '[data-qa="ergata-handoff-session-1"]'
  - action: screenshot
    name: journey_en-2-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="ergata-handoff-session-1"]'
  - action: wait_for
    selector: '[data-qa="independent-booking"][data-bk-skin="ergata-v2"][data-bk-frame="arch"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="time"]'
  - action: wait_for
    selector: '[data-qa="booking-summary"][data-media="true"] .bk-photo img[src*="ergata-v2/office"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-place"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: screenshot
    name: journey_en-3-time-chosen.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="details"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-name"]'
  - action: screenshot
    name: journey_en-4-details.png
    full_page: false
  - action: fill
    selector: '[data-qa="independent-booking-name"]'
    value: '{qa_ergata_client}'
  - action: fill
    selector: '[data-qa="independent-booking-phone"]'
    value: '{qa_ergata_phone}'
  - action: click
    selector: '[data-qa="independent-booking-submit"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-confirmed"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="done"]'
  - action: wait_for
    selector: '[data-qa="booking-moment"][data-moment="glow"]'
  - action: screenshot
    name: journey_en-5-calm-glow.png
    full_page: false
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors
- id: journey_am_mobile_dark
  title: 'Amharic, phone, dark: an online session to the time picker'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /{qa_ergata_slug}/am?display=dark
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="ergata-therapy-v2"][data-pe-mode="dark"]'
  actions:
  - action: click
    selector: '[data-qa="ergata-hero-book"]'
  - action: wait_for
    selector: '[data-qa="ergata-handoff-session-2"][lang="am"]'
  - action: screenshot
    name: journey_am-1-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="ergata-handoff-session-2"]'
  - action: wait_for
    selector: '[data-qa="independent-booking"][data-bk-skin="ergata-v2"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-steps"][data-step="time"]'
  - action: wait_for
    selector: '[data-qa="booking-summary"] .bk-photo img[src*="ergata-v2/online"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-online"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: screenshot
    name: journey_am-2-time-picker.png
    full_page: false
  - *id001
  - *id002
  options:
    color_scheme: dark

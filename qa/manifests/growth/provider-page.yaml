# Provider page: a guest opens an independent provider's page (no website, platform look), sees every service
# with its format, chooses "Online video · Zoom" for a service offered both ways, and books it end to end
# (en, desktop, light). Fixture: appointment.tests.provider_page_qa_fixtures (setup before, cleanup after).
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-provider-page
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.provider_page_qa_fixtures.browser_values
scenarios:
- id: provider_page_en_desktop_book
  title: 'Guest: provider page lists all services, choose online, book (en, desktop, light)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /schedule/p/{qa_provider_slug}?source=telegram_share
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="provider-page"][data-booking-branded="false"]'
    - type: text_contains
      value: '{qa_provider_name}'
    - type: visible_selector
      value: :nth-match([data-qa="provider-service"], 3)
    - type: visible_selector
      value: '[data-qa="provider-page-languages"]'
  actions:
  - action: get_text
    selector: '[data-qa="provider-page-bio"][lang="en"]'
    assertions:
    - type: text_contains
      value: Registered dietitian in Addis Ababa
  - action: get_text
    selector: '[data-qa="provider-services"]'
    assertions:
    - type: text_contains
      value: Online video · Zoom
    - type: text_contains
      value: In person
    - type: text_contains
      value: ETB 1,200
  - action: screenshot
    name: provider_page_en_desktop_book-1-page.png
    full_page: true
  - action: click
    selector: '[data-service="{qa_provider_both_service}"] [data-qa="provider-format-option"]:has-text("Zoom")'
  - action: wait_for
    selector: '[data-service="{qa_provider_both_service}"] [data-qa="provider-format-option"][data-state="on"]:has-text("Zoom")'
  - action: screenshot
    name: provider_page_en_desktop_book-2-online-chosen.png
    full_page: false
  - action: click
    selector: '[data-service="{qa_provider_both_service}"] [data-qa="provider-service-book"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-online"]'
    assertions:
    - type: url_contains
      value: /schedule/p/{qa_provider_slug}/
    - type: url_contains
      value: source=telegram_share
    - type: text_contains
      value: Online video · Zoom
    - type: visible_selector
      value: '[data-qa="independent-booking-all-services"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.booking.slots
      status: 200
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-chosen"]'
  # The header's Back: details -> the time picker with the time still selected -> the provider page.
  - action: click
    selector: '[data-qa="booking-back"][data-target="time"]'
  - action: wait_for
    selector: '[data-qa="booking-slot"][aria-pressed="true"]'
  - action: click
    selector: '[data-qa="booking-back"][data-target="service"]'
  - action: wait_for
    selector: '[data-qa="provider-services"]'
    assertions:
    - type: url_not_contains
      value: /schedule/p/{qa_provider_slug}/
  - action: screenshot
    name: provider_page_en_desktop_book-2b-back-to-page.png
    full_page: false
  - action: click
    selector: '[data-service="{qa_provider_both_service}"] [data-qa="provider-format-option"]:has-text("Zoom")'
  - action: click
    selector: '[data-service="{qa_provider_both_service}"] [data-qa="provider-service-book"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-online"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 2)
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '[data-qa="independent-booking-chosen"]'
  - action: fill
    selector: '[data-qa="independent-booking-name"]'
    value: '{qa_provider_client}'
  - action: fill
    selector: '[data-qa="independent-booking-phone"]'
    value: '+251910113081'
  - action: fill
    selector: '[data-qa="independent-booking-email-input"]'
    value: '{qa_provider_client_email}'
  - action: screenshot
    name: provider_page_en_desktop_book-3-details.png
    full_page: true
  - action: click
    selector: '[data-qa="independent-booking-submit"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.booking.book
      method: POST
      status_min: 200
      status_max: 299
      response_body_contains: booking_id
      timeout_ms: 25000
    - type: visible_selector
      value: '[data-qa="independent-booking-confirmed-online"]'
  - action: screenshot
    name: provider_page_en_desktop_book-4-confirmed.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: provider_page_en_unknown
  title: 'Guest: an unknown page address shows one calm message (en, desktop, light)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /schedule/p/no-such-provider-page
    assertions:
    - type: visible_selector
      value: '[data-qa="provider-page-unavailable"]'
  actions:
  - action: screenshot
    name: provider_page_en_unknown-1-unavailable.png
    full_page: false
  - action: get_console_errors

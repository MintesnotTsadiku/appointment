- id: states_am_dark
  title: 'States in Amharic, dark: unknown business (desktop), skeleton and error on a phone'
  viewport: *desktop
  checks: []
  routes:
  - path: /schedule/p/rahel-nutrition?lang=am
    assertions:
    - type: network_idle
  actions:
  - action: wait_for
    selector: '[data-qa="language-current"]:has-text("አማ")'
  - action: open_url
    url: /schedule/org/no-such-studio-qa
  - action: wait_for
    selector: '[data-qa="booking-unavailable"]'
    assertions:
    - type: visible_text
      value: ይህ የቀጠሮ ገጽ አይገኝም
  - action: screenshot
    name: states_am_dark-1-unknown-business.png
    full_page: false
  - action: open_url
    url: /schedule/p/rahel-nutrition?preview-state=error
  - action: wait_for
    selector: '[data-qa="provider-page-unavailable"] [data-qa="booking-state-retry"]'
  - action: screenshot
    name: states_am_dark-2-provider-error.png
    full_page: false
  - action: open_url
    url: /schedule/org/selam-studio/EVT-2026-000002?type=EVT-2026-000002&preview-state=empty
  - action: wait_for
    selector: '[data-qa="booking-slots-empty"]'
  - action: screenshot
    name: states_am_dark-3-no-times.png
    full_page: false
  - action: open_url
    url: /schedule/org/selam-studio?preview-state=offline
  - action: wait_for
    selector: '[data-qa="booking-offline"]'
  - action: screenshot
    name: states_am_dark-4-offline.png
    full_page: false

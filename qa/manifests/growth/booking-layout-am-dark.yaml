# Booking layout in Amharic, dark (desktop and phone). No fixture: Selam, Bloom, Yared and Rahel showcases; nothing is booked.
# Habesha time is the default clock in Amharic on provider schedulers; the organization scheduler keeps the toggle.
# See docs/growth/BOOKING_LAYOUT.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-booking-layout-am-dark
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
scenarios:
- id: layout_selam_am_desktop_dark
  title: 'Selam in Amharic: services, picker, chosen time in the bar (am, desktop, dark)'
  viewport: &desktop
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /schedule/org/selam-studio
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="language-toggle"]'
  actions:
  - action: press
    selector: '[data-qa="language-toggle"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation.messages
      status: 200
  - action: wait_for
    selector: '[data-qa="language-current"]:has-text("አማ")'
  - action: wait_for
    selector: '[data-qa="booking-services-bar"]:has-text("አገልግሎት")'
  - action: screenshot
    name: layout_selam_am_desktop_dark-1-services.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-tomorrow"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-time-format-option"][data-value="ethiopian"]'
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '[data-qa="booking-bar"]'
    assertions:
    - type: text_contains
      selector: '[data-qa="booking-continue"]'
      value: ቀጥል
    - type: text_contains
      selector: '[data-qa="booking-bar-when"]'
      value: ሰዓት
  - action: screenshot
    name: layout_selam_am_desktop_dark-2-chosen-habesha.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: layout_rahel_am_desktop_dark
  title: 'Rahel in Amharic: provider page and scheduler (am, desktop, dark)'
  viewport: *desktop
  checks: []
  routes:
  - path: /schedule/p/rahel-nutrition?lang=am
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="provider-page-name"]'
  actions:
  - action: wait_for
    selector: '[data-qa="language-current"]:has-text("አማ")'
  - action: screenshot
    name: layout_rahel_am_desktop_dark-1-page.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="provider-service-book"], 1)
  - action: wait_for
    selector: '[data-qa="booking-picker"][data-wide="true"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '[data-qa="booking-bar"]'
  - action: screenshot
    name: layout_rahel_am_desktop_dark-2-chosen.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: layout_bloom_am_mobile_dark
  title: 'Bloom in Amharic on a phone: providers row, strip of days, the bar (am, mobile, dark)'
  viewport: &mobile
    width: 390
    height: 844
  checks: []
  routes:
  - path: /schedule/org/bloom-studio
    assertions:
    - type: network_idle
  actions:
  - action: press
    selector: '[data-qa="language-toggle"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation.messages
      status: 200
  - action: wait_for
    selector: '[data-qa="language-current"]:has-text("አማ")'
  - action: screenshot
    name: layout_bloom_am_mobile_dark-1-services.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-strip"]'
  - action: click
    selector: '[data-qa="booking-tomorrow"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 3)
    timeout_ms: 20000
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 3)
  - action: scroll
    delta_y: 700
  - action: wait_for
    selector: '[data-qa="booking-bar"]'
  - action: screenshot
    name: layout_bloom_am_mobile_dark-2-scrolled-bar.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

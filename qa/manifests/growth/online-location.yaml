# Online locations: the owner adds an online location with a fixed link (en, desktop and phone, light).
# Fixture: appointment.tests.template_ergata_qa_fixtures (setup before, cleanup after). Siblings:
# online-location-guest.yaml (guest books online, manage page join state) and
# online-location-reception-am-dark.yaml (staff badge and per-booking link). See docs/growth/ONLINE_LOCATIONS.md.
app: appointment
base_url: http://localhost:47800
default_role: Staff
auth:
  type: frappe_session
  username: yared.tesfaye.counselling@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-growth-online-location
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.tests.template_ergata_qa_fixtures.browser_values
scenarios:
- id: online_location_owner_en_desktop
  title: 'Owner adds an online location with a fixed link (en, desktop, light)'
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /settings/location
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="location-card"][data-qa-type="online"]'
    - type: visible_selector
      value: '[data-qa="location-card"][data-qa-type="in_person"]'
    - type: text_contains
      value: Online video · Google Meet
  actions:
  - action: screenshot
    name: online_location_owner_en_desktop-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="location-add-online"], 1)
  - action: wait_for
    selector: '[data-qa="location-dialog"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="location-type-online"][data-state="on"]'
    - type: visible_selector
      value: '[data-qa="location-sessions"]'
  - action: fill
    selector: '[data-qa="location-name"]'
    value: '{qa_online_new_location}'
  - action: click
    selector: '[data-qa="location-platform"]'
  - action: click
    selector: '[role="option"][data-value="Zoom"]'
  - action: fill
    selector: '[data-qa="location-link"]'
    value: http://zoom.us/j/84512093377
  - action: click
    selector: '[data-qa="location-save"]'
    assertions:
    - type: text_contains
      value: Enter a meeting link that starts with https://
  - action: screenshot
    name: online_location_owner_en_desktop-2-link-error.png
    full_page: false
  - action: fill
    selector: '[data-qa="location-link"]'
    value: https://zoom.us/j/84512093377
  - action: click
    selector: '#session-{qa_online_intro_service}'
  - action: screenshot
    name: online_location_owner_en_desktop-3-form.png
    full_page: false
  - action: click
    selector: '[data-qa="location-save"]'
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.locations.save
      method: POST
      status: 200
  - action: wait_for
    selector: '[data-qa="location-card"][data-qa-type="online"] >> text={qa_online_new_location}'
    assertions:
    - type: text_contains
      value: Online video · Zoom
  - action: screenshot
    name: online_location_owner_en_desktop-4-saved.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: online_location_owner_en_mobile
  title: 'Owner sees online and office locations and opens the online form (en, phone, light)'
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /settings/location
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="location-card"][data-qa-type="online"]'
  actions:
  - action: screenshot
    name: online_location_owner_en_mobile-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="location-add-online"], 1)
  - action: wait_for
    selector: '[data-qa="location-dialog"]'
  - action: click
    selector: '[data-qa="location-link-per-booking"]'
    assertions:
    - type: text_contains
      value: Add each booking's link at the reception desk.
  - action: screenshot
    name: online_location_owner_en_mobile-2-per-booking.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

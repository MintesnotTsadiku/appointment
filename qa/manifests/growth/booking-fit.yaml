# Booking time picker fits the window (owner request 2026-10-15). No fixture: it reads the Bloom, Selam, Tena, Abugida and
# Meron showcases and Rahel's provider page (appointment.tests.provider_page_qa_fixtures.setup must have run once), and books nothing.
# Laptops (1280x720, 1366x768, 1440x900; 1660x880 for Selam and 1920x1080 for Bloom): the summary, the calendar, the time format, the footer (booking notes, powered by)
# and the "Your time" bar are inside the window without a page scroll; only the slot list scrolls. After the last open time
# of a day (at the bottom of the list) is chosen, the bar at the top shows it with Continue, and Continue opens the details.
# Phone (390x844): the summary and the time format at the top, the sticky strip with "Your time", Continue at the bottom.
# The details step (2026-10-15): on laptops (1280x720 to 1920x1080) the summary, the Confirm bar with Confirm, and the footer
# with Powered by are inside the window without a page scroll (only the form scrolls); on the phone the summary and the fixed
# Confirm bar are in view. The done step "Time" in the header (the "Time" chevron on the phone) goes back to the picker with
# the chosen time still selected.
# `?qa-fit=1` (development builds only) makes the picker write `data-qa-fit` with the parts that are fully inside the window;
# the runner has no bounding-box assertion. See docs/growth/BOOKING_LAYOUT.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-booking-fit
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 150000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
scenarios:
- id: fit_bloom_1280x720_en_light
  title: 'Bloom: the time picker fits 1280x720 (en, light)'
  viewport:
    width: 1280
    height: 720
  options:
    color_scheme: light
  checks: []
  routes:
  - path: /schedule/org/bloom-studio?display=light&qa-fit=1
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="booking-service"]'
  actions:
  - action: click
    selector: ':nth-match([data-qa="booking-service"], 1)'
  - action: wait_for
    selector: '[data-qa="booking-picker"][data-wide="true"]'
  - action: click
    selector: ':nth-match([data-qa="booking-date"]:not([disabled]), 2)'
  - action: wait_for
    selector: ':nth-match([data-qa="booking-slot"]:not([disabled]), 1)'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-picker"][data-qa-fit~="summary"][data-qa-fit~="calendar"][data-qa-fit~="format"][data-qa-fit~="zone"][data-qa-fit~="footer"][data-qa-fit~="bar"][data-qa-fit~="no-page-scroll"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="booking-bar-empty"]'
    - type: visible_selector
      value: '[data-qa="booking-picker-footer"] [data-qa="booking-info"]'
    - type: visible_selector
      value: '[data-qa="booking-picker-footer"] [data-qa="powered-by"]'
  - action: screenshot
    name: fit_bloom_1280x720_en_light-1-picker.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-slot"]:not([disabled]) >> nth=-1'
  - action: wait_for
    selector: '[data-qa="booking-picker"][data-qa-fit~="summary"][data-qa-fit~="calendar"][data-qa-fit~="footer"][data-qa-fit~="bar"][data-qa-fit~="go"][data-qa-fit~="chosen"][data-qa-fit~="no-page-scroll"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="booking-bar"] [data-qa="booking-bar-when"]'
    - type: visible_selector
      value: '[data-qa="booking-bar"] [data-qa="booking-continue"]'
  - action: screenshot
    name: fit_bloom_1280x720_en_light-2-chosen.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '[data-qa="booking-details-layout"][data-wide="true"][data-qa-fit~="summary"][data-qa-fit~="bar"][data-qa-fit~="go"][data-qa-fit~="footer"][data-qa-fit~="powered"][data-qa-fit~="no-page-scroll"]'
    assertions:
    - type: visible_selector
      value: '#userName'
    - type: visible_selector
      value: '[data-qa="booking-confirm-bar"] [data-qa="booking-confirm"]'
    - type: visible_selector
      value: '[data-qa="booking-details-footer"] [data-qa="powered-by"]'
    - type: visible_selector
      value: '[data-qa="booking-step-link"][data-target="time"]'
  - action: screenshot
    name: fit_bloom_1280x720_en_light-3-details.png
    full_page: false
  - action: click
    selector: '[data-qa="booking-step-link"][data-target="time"]'
  - action: wait_for
    selector: '[data-qa="booking-picker"] [data-qa="booking-slot"][aria-pressed="true"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="booking-steps"][data-step="time"]'
  - action: get_console_errors
  - action: get_network_errors

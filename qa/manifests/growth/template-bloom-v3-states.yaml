# Bloom v3 states. Fixture: appointment.tests.template_bloom_v3_qa_fixtures (setup before, cleanup after; cleanup deletes the
# booking that the success scenario makes, by the QA client's exact email). Development-only query values: `preview-time` (Addis clock),
# `preview-availability` (off, empty) and `preview-state=loading` (the template's own loading screen).
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-bloom-v3-states
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_bloom_v3_qa_fixtures.browser_values
scenarios:
- id: bloom_night_light
  title: 'After dark in light mode: night photos, evening greeting'
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=20:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Good evening
  actions:
  - action: wait_for
    selector: .b3-mirror img[src*="hero-night"]
  - action: screenshot
    name: bloom_night_light-1-hero.png
    full_page: false
  - action: click
    selector: '#b3-band-title'
  - action: wait_for
    selector: .b3-band-photo img[src*="band-night"]
  - action: screenshot
    name: bloom_night_light-2-band.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_morning
  title: 'Morning in light mode: day photos'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=08:15
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Good morning
  actions:
  - action: wait_for
    selector: .b3-mirror img[src$="/hero.webp"]
  - action: wait_for
    selector: :nth-match([data-qa="bloom-open-now"][data-open="false"], 1)
  - action: screenshot
    name: bloom_morning-1-hero.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_availability_on
  title: Live availability on (the showcase setting)
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=16:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Next free chair
  actions:
  - action: wait_for
    selector: '[data-qa="bloom-next-free"]'
  - action: wait_for
    selector: '[data-qa="bloom-chair-next-0"]'
  - action: click
    selector: '#b3-menu-title'
  - action: wait_for
    selector: :nth-match(.b3-menu-live, 1)
  - action: screenshot
    name: bloom_availability_on-1-menu.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_availability_off
  title: 'Live availability off: no chip, the page stays complete'
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=16:30&preview-availability=off
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: '[data-qa="bloom-next-free"]'
    state: detached
  - action: wait_for
    selector: '[data-qa="bloom-chair-next-0"]'
    state: detached
  - action: screenshot
    name: bloom_availability_off-1-hero.png
    full_page: false
  - action: click
    selector: '#b3-team-title'
  - action: screenshot
    name: bloom_availability_off-2-team.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_availability_empty
  title: 'Live availability with nothing free: no chip'
  viewport: &id002
    width: 390
    height: 844
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=16:30&preview-availability=empty
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: '[data-qa="bloom-next-free"]'
    state: detached
  - action: screenshot
    name: bloom_availability_empty-1-hero.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_loading
  title: The template's own loading screens (site and handoff)
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_bloom_slug}?preview-state=loading&display=light
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="bloom-loading"]'
  actions:
  - action: screenshot
    name: bloom_loading-1-site.png
    full_page: false
  - action: open_url
    url: /{qa_bloom_slug}/book?preview-state=loading&display=dark
    assertions:
    - type: visible_selector
      value: '[data-qa="bloom-loading"]'
  - action: screenshot
    name: bloom_loading-2-handoff-dark.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_loading_mobile
  title: Loading screen on a phone
  viewport: *id002
  checks: []
  routes:
  - path: /{qa_bloom_slug}/am?preview-state=loading&display=dark
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="bloom-loading"]'
  actions:
  - action: screenshot
    name: bloom_loading_mobile-1.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_success
  title: A guest books from the Bloom landing page and sees the petals
  viewport: *id001
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
  actions:
  - action: click
    selector: '[data-qa="bloom-hero-book"]'
  - action: wait_for
    selector: '[data-qa="bloom-handoff-book"]'
  - action: click
    selector: '[data-qa="bloom-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_bloom_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_bloom_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: '[data-qa="booking-continue"]'
  - action: wait_for
    selector: '#userName'
  - action: fill
    selector: '#userName'
    value: '{qa_bloom_client}'
  - action: fill
    selector: '[data-qa="booking-phone"]'
    value: '{qa_bloom_phone}'
  - action: fill
    selector: '[data-qa="booking-email"]'
    value: '{qa_bloom_email}'
  - action: click
    selector: '[data-qa="booking-confirm"]'
  - action: wait_for
    selector: '[data-qa="booking-success"]'
    timeout_ms: 20000
  - action: wait_for
    selector: '[data-qa="booking-moment"]'
  - action: screenshot
    name: bloom_success-1-petals.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

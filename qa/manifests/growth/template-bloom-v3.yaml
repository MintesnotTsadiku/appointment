# Bloom v3 "Golden Hour Salon" (light, full motion). Fixture: appointment.tests.template_bloom_v3_qa_fixtures (setup before, cleanup after).
# Every section of /bloom-studio and /bloom-studio/am: hero (greeting, open-now, next free chair, look stack), menu, lookbook with
# before/after, chairs, story, steps, proof, benefits, review marquee with pause, FAQ with the Habesha clock, room tabs, booking band,
# footer; then the booking handoff (view transition target) and the scheduler time picker. `?preview-time=` fixes the Addis clock
# (development builds only). See docs/design/BLOOM_V3.md.
app: appointment
base_url: http://localhost:47800
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-growth-template-bloom-v3
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.template_bloom_v3_qa_fixtures.browser_values
scenarios:
- id: bloom_en_desktop
  title: Bloom v3 (en, desktop, light, afternoon)
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /{qa_bloom_slug}?display=light&preview-time=16:30
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-template="bloom-hair-v3"][data-pe-recipe="bloom-hair"]'
    - type: text_contains
      value: Good afternoon
  actions:
  - action: wait_for
    selector: .b3-mirror img
  - action: wait_for
    selector: '[data-qa="bloom-next-free"]'
  - action: screenshot
    name: bloom_en_desktop-01-hero.png
    full_page: false
  - action: click
    selector: '[data-qa="bloom-next-look"]'
  - action: screenshot
    name: bloom_en_desktop-02-next-look.png
    full_page: false
  - action: click
    selector: '#b3-menu-title'
  - action: screenshot
    name: bloom_en_desktop-03-menu.png
    full_page: false
  - action: click
    selector: '#b3-looks-title'
  - action: press
    selector: '[data-qa="bloom-before-after"] input'
    key: ArrowLeft
  - action: screenshot
    name: bloom_en_desktop-04-lookbook.png
    full_page: false
  - action: click
    selector: '#b3-team-title'
  - action: screenshot
    name: bloom_en_desktop-05-team.png
    full_page: false
  - action: click
    selector: '#b3-story-title'
  - action: screenshot
    name: bloom_en_desktop-06-story.png
    full_page: false
  - action: click
    selector: '#b3-steps-title'
  - action: screenshot
    name: bloom_en_desktop-07-steps.png
    full_page: false
  - action: click
    selector: :nth-match(.b3-proof-label, 1)
  - action: screenshot
    name: bloom_en_desktop-08-proof.png
    full_page: false
  - action: click
    selector: '#b3-notes-title'
  - action: screenshot
    name: bloom_en_desktop-09-benefits.png
    full_page: false
  - action: click
    selector: '#b3-reviews-title'
  - action: click
    selector: '[data-qa="bloom-reviews-pause"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="bloom-reviews-pause"][aria-pressed="true"]'
  - action: screenshot
    name: bloom_en_desktop-10-reviews-paused.png
    full_page: false
  - action: click
    selector: '#b3-faq-title'
  - action: click
    selector: :nth-match(.b3-faq-list summary, 1)
  - action: click
    selector: '[data-qa="bloom-habesha-toggle"]'
    assertions:
    - type: text_contains
      selector: .b3-hours
      value: ከጠዋቱ 3 ሰዓት
  - action: screenshot
    name: bloom_en_desktop-11-faq-hours.png
    full_page: false
  - action: click
    selector: '#b3-rooms-title'
  - action: click
    selector: '[data-qa="bloom-room-tab-1"]'
    assertions:
    - type: visible_selector
      value: '[data-qa="bloom-room-tab-1"][aria-selected="true"]'
  - action: screenshot
    name: bloom_en_desktop-12-rooms.png
    full_page: false
  - action: click
    selector: '#b3-band-title'
  - action: screenshot
    name: bloom_en_desktop-13-band.png
    full_page: false
  - action: click
    selector: .b3-footer-name
  - action: wait_for
    selector: '[data-qa="template-credit"]'
  - action: screenshot
    name: bloom_en_desktop-14-footer.png
    full_page: false
  - action: click
    selector: '#b3-hero-title'
  - action: screenshot
    name: bloom_en_desktop-15-full.png
    full_page: true
  - action: click
    selector: '[data-qa="bloom-hero-book"]'
  - action: wait_for
    selector: '[data-vt-book]'
  - action: wait_for
    selector: '[data-qa="bloom-handoff-book"]'
  - action: screenshot
    name: bloom_en_desktop-16-handoff.png
    full_page: false
  - action: click
    selector: '[data-qa="bloom-handoff-book"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: screenshot
    name: bloom_en_desktop-17-scheduler.png
    full_page: false
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_bloom_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_bloom_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: screenshot
    name: bloom_en_desktop-18-time-picker.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

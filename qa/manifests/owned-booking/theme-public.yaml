app: appointment
base_url: http://127.0.0.20:25310
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
fixtures:
  provider: appointment.tests.acceptance_demo.browser_values
scenarios:
  - id: theme_public_dark
    title: The public surface honours an explicit dark theme choice
    viewport: {width: 1440, height: 960}
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="theme-toggle"]'
    actions:
      - action: press
        selector: '[data-qa="theme-toggle"]'
        key: Enter
      - action: press
        selector: '[data-qa="theme-toggle"]'
        key: Enter
        assertions:
          - type: visible_selector
            value: 'html.dark'
      - action: screenshot
        name: theme-public-dark.png
        full_page: true
      - action: get_console_errors
      - action: get_network_errors

app: appointment
base_url: http://127.0.0.20:25310
default_role: Provider
auth:
  type: frappe_session
  username: '{qa_provider_user}'
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
fixtures:
  provider: appointment.tests.owned_booking_fixtures.browser_values
scenarios:
  - id: owned_visible_setup
    title: Provider creates and publishes a business through visible controls
    viewport: {width: 1440, height: 960}
    checks: []
    routes:
      - path: /settings/business
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '#business_name'
    actions:
      - action: fill
        selector: '#business_name'
        value: '{qa_business_name}'
      - action: fill
        selector: '#location_name'
        value: '{qa_location_name}'
      - action: fill
        selector: '#service_name'
        value: 'Visible consultation'
      - action: click
        selector: '[data-qa="business-save"]'
        assertions:
          - type: visible_text
            value: Business saved as a draft
          - type: network_request
            url_contains: appointment.scheduler.workspace.create
            method: POST
            status: 200
      - action: screenshot
        name: visible-business-draft.png
        full_page: true
      - action: click
        selector: '[data-qa="business-publish"]'
        assertions:
          - type: visible_selector
            value: '[data-qa="business-public-link"]'
          - type: network_request
            url_contains: appointment.scheduler.workspace.publish
            method: POST
            status: 200
      - action: screenshot
        name: visible-business-published.png
        full_page: true
      - action: get_console_errors
      - action: get_network_errors

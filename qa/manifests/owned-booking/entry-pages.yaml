app: appointment
base_url: http://127.0.0.20:25310
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
scenarios:
  - id: guest_login_entry
    title: Direct login navigation loads the live React form
    viewport: {width: 1440, height: 960}
    checks: []
    routes:
      - path: /login
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="login-heading"]'
    actions:
      - action: get_console_errors
      - action: get_network_errors
  - id: guest_home_entry
    title: Home page starts without template or realtime errors
    viewport: {width: 1440, height: 960}
    checks: []
    routes:
      - path: /
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '#root > *'
    actions:
      - action: screenshot
        name: home-entry.png
      - action: get_console_errors
      - action: get_network_errors

app: appointment
base_url: http://127.0.0.20:25310
default_role: Receptionist
auth:
  type: frappe_session
  username: '{qa_reception_user}'
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
fixtures:
  provider: appointment.tests.acceptance_demo.browser_values
scenarios:
  - id: role_receptionist_sees_booking
    title: A receptionist recovers to the next booking date and sees the customer
    viewport: {width: 1440, height: 960}
    checks: []
    routes:
      - path: /reception
        assertions:
          - type: network_idle
          - type: visible_selector
            value: '[data-qa="reception-scope"]'
    actions:
      - action: click
        selector: '[data-qa="reception-next-booking"]'
        assertions:
          - type: visible_text
            value: Synthetic Customer
          - type: network_request
            url_contains: get_desk_appointments
            response_body_contains: Synthetic Customer
            status: 200
      - action: screenshot
        name: role-receptionist-booking.png
        full_page: true
      - action: get_console_errors
      - action: get_network_errors

app: appointment
base_url: http://127.0.0.174:41960
default_role: Staff
auth:
  type: frappe_session
  username: multi.manager@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-analytics
capture_trace: true
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.rich_demo.browser_values
scenarios:
- id: multi_reception_insights
  title: Coordinator views salon as receptionist
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Bole Bloom Hair Studio") button'
  - action: wait_for
    selector: '[data-qa="reception-insight-brief"]'
  - action: click
    selector: 'a[href="/analytics"]:has-text("Insights")'
  - action: wait_for
    selector: '[data-qa="workspace-analytics"]'
    assertions:
    - type: visible_text
      value: Reception insights
  - action: get_dom_snapshot
    name: multi-reception-insights.html
  - action: get_console_errors
  - action: get_network_errors
- id: multi_manager_insights
  title: Coordinator views clinic as manager
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Tena Family Clinic") button'
  - action: wait_for
    selector: '[data-qa="workspace-analytics"]'
  - action: click
    selector: 'a[href="/analytics"]:has-text("Insights")'
  - action: wait_for
    selector: '[data-qa="workspace-analytics"]'
    assertions:
    - type: visible_text
      value: Booking value at catalog prices
  - action: get_dom_snapshot
    name: multi-manager-insights.html
  - action: get_console_errors
  - action: get_network_errors

# Provider: only own customers; the profile page shows history without contact details or notes.
app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.provider1@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-customer-profiles
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.customer_qa_fixtures.browser_values
scenarios:
- id: cp_provider_en_desktop
  title: Provider sees own customers without contact details (en, desktop)
  viewport: &id004
    width: 1440
    height: 900
  checks: []
  routes: &id001
  - path: /customers
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="customers-list"]'
    - type: no_blank_page
  actions:
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
  - action: screenshot
    name: cp_provider_en_desktop-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: visible_selector
      value: '[data-qa="customer-history"]'
  - action: screenshot
    name: cp_provider_en_desktop-2-profile.png
    full_page: true
  - &id002
    action: get_console_errors
  - &id003
    action: get_network_errors
- id: cp_provider_en_mobile
  title: Provider sees own customers without contact details (en, mobile)
  viewport: &id006
    width: 390
    height: 844
  checks: []
  routes: *id001
  actions:
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
  - action: screenshot
    name: cp_provider_en_mobile-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: visible_selector
      value: '[data-qa="customer-history"]'
  - action: screenshot
    name: cp_provider_en_mobile-2-profile.png
    full_page: true
  - *id002
  - *id003
- id: cp_provider_am_desktop
  title: Provider sees own customers without contact details (am, desktop)
  viewport: *id004
  checks: []
  routes: *id001
  actions:
  - &id005
    action: press
    selector: '[data-qa="topnav-language"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation
      status: 200
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
  - action: screenshot
    name: cp_provider_am_desktop-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: visible_selector
      value: '[data-qa="customer-history"]'
  - action: screenshot
    name: cp_provider_am_desktop-2-profile.png
    full_page: true
  - *id005
  - *id002
  - *id003
- id: cp_provider_am_mobile
  title: Provider sees own customers without contact details (am, mobile)
  viewport: *id006
  checks: []
  routes: *id001
  actions:
  - *id005
  - action: wait_for
    selector: :nth-match([data-qa="customer-row"], 1)
  - action: screenshot
    name: cp_provider_am_mobile-1-list.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="customer-row"], 1)
    assertions:
    - type: visible_selector
      value: '[data-qa="customer-history"]'
  - action: screenshot
    name: cp_provider_am_mobile-2-profile.png
    full_page: true
  - *id005
  - *id002
  - *id003

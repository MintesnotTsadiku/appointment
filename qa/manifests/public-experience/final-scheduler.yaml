app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-public-experience-scheduler-final
capture_trace: true
capture_video: true
capture_instruction_timeline: true
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: pe_selam_scheduler_desktop
  title: selam scheduler desktop
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: '{demo_selam_scheduler}'
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-booking-branded="true"][data-pe-recipe="warm-vitality-studio"]'
  actions:
  - action: screenshot
    name: selam-scheduler-desktop.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

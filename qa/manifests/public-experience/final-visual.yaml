    - type: no_blank_page
    - type: visible_selector
      value: '[data-pe-booking][data-pe-recipe="warm-vitality-studio"]'
  actions:
  - action: screenshot
    name: selam-book-desktop.png
    full_page: false
  - action: get_console_errors
  - action: get_network_errors

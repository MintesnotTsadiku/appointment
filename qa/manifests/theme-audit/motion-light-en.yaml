app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-theme-audit-motion
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 300000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: no-preference
  show_action_labels: false
  show_cursor: false
  show_zoom_spotlight: false
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: selam_motion
  title: selam motion
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: '{demo_selam}'
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-pe-root][data-motion-ready]'
  actions:
  - action: screenshot
    name: selam-motion-0-hero.png
    full_page: false
  - action: scroll
    delta_y: 1
  - action: scroll
    delta_y: 760
  - action: wait_for
    selector: '[data-pe-root][data-motion-ready] [data-revealed] >> nth=0'
    timeout_ms: 8000
  - action: screenshot
    name: selam-motion-1.png
    full_page: false
  - action: scroll
    delta_y: 760
  - action: screenshot
    name: selam-motion-2.png
    full_page: false
  - action: scroll
    delta_y: 760
  - action: screenshot
    name: selam-motion-3.png
    full_page: false
  - action: scroll
    delta_y: 3400
  - action: wait_for
    selector: .sm-session[data-revealed] >> nth=0
    timeout_ms: 8000
  - action: get_console_errors
  - action: get_network_errors

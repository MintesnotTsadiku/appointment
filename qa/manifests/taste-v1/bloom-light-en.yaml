app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-taste-v1-bloom-light-en
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
  show_action_labels: false
  show_cursor: false
  show_zoom_spotlight: false
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: bloom_landing_desktop_light_en
  title: bloom landing desktop light en
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: '{demo_bloom}'
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: '[data-pe-root][data-pe-recipe="bloom-hair"]'
    - type: network_request
      url_contains: fonts/bloom/anton
      min_count: 1
  actions:
  - action: screenshot
    name: bloom-landing-desktop-light-en-first-view.png
    full_page: false
  - action: screenshot
    name: bloom-landing-desktop-light-en.png
    full_page: true
  - action: scroll
    delta_y: 0
  - action: get_console_errors
  - action: get_network_errors
- id: bloom_landing_phone_light_en
  title: bloom landing phone light en
  viewport:
    width: 390
    height: 844

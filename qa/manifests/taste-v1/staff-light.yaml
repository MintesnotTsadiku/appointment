app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-taste-v1-staff-light
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 180000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
  show_action_labels: false
  show_cursor: false
  show_zoom_spotlight: false
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: staff_home_desktop_light
  title: staff home desktop light
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: no_blank_page
    - type: visible_selector
      value: h1
  actions:
  - action: screenshot
    name: staff-home-desktop-light-first-view.png
    full_page: false
  - action: screenshot
    name: staff-home-desktop-light.png
    full_page: true
  - action: scroll
    delta_y: 0
  - action: get_console_errors
  - action: get_network_errors
- id: staff_home_phone_light
  title: staff home phone light

- id: form_am_desktop
  title: Service list and details form are in Amharic (desktop); empty submit shows
    translated errors, nothing is booked
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="language-toggle"]'
  actions:
  - action: press
    selector: '[data-qa="language-toggle"]'
    key: Enter
    assertions:
    - type: network_request
      url_contains: appointment.scheduler.translation.messages
      status: 200
  - action: open_url
    url: /bloom-studio/book
  - action: wait_for
    selector: '[data-pe-booking]'
  - action: click
    selector: :nth-match([data-pe-booking] a.bl-btn, 1)
    assertions:
    - type: url_contains
      value: /schedule/org/
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
    assertions:
    - type: visible_text
      value: ሊይዙት የሚፈልጉትን የቀጠሮ ዓይነት ይምረጡ
  - action: screenshot
    name: form_am_desktop-1-services.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '#userName'
    assertions:
    - type: visible_text
      value: ቀጠሮዎን ያረጋግጡ
    - type: visible_text
      value: የቀጠሮ ማጠቃለያ
  - action: click
    selector: '[data-qa="booking-confirm"]'
    assertions:
    - type: visible_text
      value: ስም ያስፈልጋል
    - type: visible_text
      value: ኢሜይል ያስፈልጋል
  - action: screenshot
    name: form_am_desktop-2-details.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

# Guests open the Bloom scheduler, reach the details form and submit it empty. Nothing is booked.
# Picks the first open Bloom day (qa_days), not "tomorrow", which is closed on Mondays.
app: appointment
base_url: http://127.0.0.84:44430
default_role: Guest
auth:
  type: none
artifact_root: /tmp/agent_browser_qa/appointment-booking-form
capture_trace: true
capture_video: false
capture_instruction_timeline: true
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.tests.qa_days.browser_values
scenarios:
- id: form_en_desktop
  title: Service list and details form are in English (desktop); empty submit shows
    translated errors, nothing is booked
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /bloom-studio/book
    assertions:
    - type: network_idle
  actions:
  - action: wait_for
    selector: '[data-pe-booking]'
  - action: click
    selector: :nth-match([data-pe-booking] a.bl-btn, 1)
    assertions:
    - type: url_contains
      value: /schedule/org/
  - action: wait_for
    selector: :nth-match([data-qa="booking-service"], 1)
    assertions:
    - type: visible_text
      value: Choose the type of appointment you'd like to book
  - action: screenshot
    name: form_en_desktop-1-services.png
    full_page: true
  - action: click
    selector: :nth-match([data-qa="booking-service"], 1)
  - action: wait_for
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]:not([disabled])'
    timeout_ms: 20000
  - action: click
    selector: '[data-qa="booking-date"][data-qa-date="{qa_open_day}"]'
  - action: wait_for
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: click
    selector: :nth-match([data-qa="booking-slot"]:not([disabled]), 1)
  - action: wait_for
    selector: '#userName'
    assertions:
    - type: visible_text
      value: Confirm Your Booking
    - type: visible_text
      value: Booking Summary
  - action: click
    selector: '[data-qa="booking-confirm"]'
    assertions:
    - type: visible_text
      value: Name is required
    - type: visible_text
      value: Email is required
  - action: screenshot
    name: form_en_desktop-2-details.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

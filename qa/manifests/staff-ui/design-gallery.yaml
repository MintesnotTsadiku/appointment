app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: design_gallery_desktop
  title: design_gallery_desktop
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /settings/public-experience
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="design-gallery"]'
  actions:
  - action: screenshot
    name: design-gallery-desktop.png
    full_page: true
  - action: click
    selector: '[data-qa="design-use-tena-clinic"]'
  - action: wait_for
    selector: '[data-qa="selected-design"]'
    assertions:
    - type: visible_text
      value: Tena Clinic
  - action: screenshot
    name: design-gallery-switched.png
    full_page: true
  - action: click
    selector: '[data-qa="public-experience-readiness"]'
  - action: wait_for
    selector: '[data-qa="public-experience-checks"]'
  - action: screenshot
    name: design-readiness.png
    full_page: true
  - &id001
    action: get_console_errors
  - &id002
    action: get_network_errors
- id: design_gallery_mobile
  title: design_gallery_mobile
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /settings/public-experience
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="design-gallery"]'
  actions:
  - action: screenshot
    name: design-gallery-mobile.png
    full_page: true
  - *id001
  - *id002

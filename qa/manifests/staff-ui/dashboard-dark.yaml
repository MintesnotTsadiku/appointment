app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: dashboard_overview_desktop_dark
  title: Overview dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="dashboard-customize"]'
  actions:
  - action: screenshot
    name: dash-overview-desktop-dark.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: dashboard_insights_mobile_dark
  title: Insights dark phone
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="analytics-trend"]'
  actions:
  - action: screenshot
    name: dash-insights-mobile-dark.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors

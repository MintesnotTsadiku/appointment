    name: reception-analytics-desktop-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: reception-analytics-desktop-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: reception_analytics_mobile_dark
  title: reception /analytics mobile dark
  viewport:
    width: 390

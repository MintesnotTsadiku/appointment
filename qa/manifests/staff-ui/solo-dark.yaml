app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: selam.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: solo_home_desktop_dark
  title: solo /home desktop dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: solo-home-desktop-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: solo-home-desktop-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: solo_home_mobile_dark
  title: solo /home mobile dark
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: solo-home-mobile-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: solo-home-mobile-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: solo_settings_services_desktop_dark
  title: solo /settings/services desktop dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /settings/services
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: solo-settings-services-desktop-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: solo-settings-services-desktop-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: solo_settings_services_mobile_dark
  title: solo /settings/services mobile dark
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /settings/services
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: solo-settings-services-mobile-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: solo-settings-services-mobile-dark.html
  - action: get_console_errors
  - action: get_network_errors

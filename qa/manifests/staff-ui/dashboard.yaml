app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: dashboard_overview_desktop
  title: 'Overview dashboard: explain, customize, add, save, reload, reset'
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="dashboard-customize"]'
  actions:
  - action: screenshot
    name: dash-overview-desktop.png
  - action: click
    selector: '[data-widget="noShowRate"] header button'
  - action: wait_for
    selector: '[role="dialog"]'
  - action: screenshot
    name: dash-widget-info.png
  - action: press
    selector: '[role="dialog"]'
    key: Escape
  - action: click
    selector: '[data-qa="dashboard-guide"]'
  - action: wait_for
    selector: '[role="dialog"]'
  - action: screenshot
    name: dash-guide.png
  - action: press
    selector: '[role="dialog"]'
    key: Escape
  - action: click
    selector: '[data-qa="dashboard-customize"]'
  - action: wait_for
    selector: '[data-qa="dashboard-edit-bar"]'
  - action: screenshot
    name: dash-customize.png
  - action: click
    selector: '[data-qa="dashboard-add"]'
  - action: wait_for
    selector: '[data-qa="add-widget-weekdayLoad"]'
  - action: screenshot
    name: dash-add-panel.png
  - action: click
    selector: '[data-qa="add-widget-weekdayLoad"]'
  - action: press
    selector: '[role="dialog"]'
    key: Escape
  - action: click
    selector: '[data-qa="dashboard-save"]'
    assertions:
    - type: visible_text
      value: Dashboard layout saved
  - action: open_url
    url: /home
    wait_until: load
    timeout_ms: 60000
  - action: wait_for
    selector: '[data-widget="weekdayLoad"]'
  - action: screenshot
    name: dash-after-reload.png
  - action: click
    selector: '[data-qa="dashboard-customize"]'
  - action: click
    selector: '[data-qa="dashboard-reset"]'
  - action: click
    selector: '[data-qa="dashboard-save"]'
    assertions:
    - type: visible_text
      value: Dashboard layout saved
  - action: get_console_errors
  - action: get_network_errors
- id: dashboard_insights_desktop
  title: Insights dashboard
  viewport: *id001
  checks: []
  routes:
  - path: /analytics
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="analytics-trend"]'
  actions:
  - action: screenshot
    name: dash-insights-desktop.png
    full_page: true
  - action: get_console_errors
  - action: get_network_errors
- id: dashboard_overview_mobile
  title: Overview stacked on a phone
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="dashboard-customize"]'
  actions:
  - action: screenshot
    name: dash-overview-mobile.png
    full_page: true
  - action: click
    selector: '[data-qa="dashboard-customize"]'
  - action: wait_for
    selector: '[data-qa="dashboard-edit-bar"]'
  - action: screenshot
    name: dash-customize-mobile.png
  - action: click
    selector: '[data-qa="dashboard-cancel"]'
  - action: get_console_errors
  - action: get_network_errors

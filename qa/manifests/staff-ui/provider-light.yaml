app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.provider1@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
  reduced_motion: reduce
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: provider_calendar_desktop_light
  title: provider /calendar desktop light
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /calendar
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: provider-calendar-desktop-light.png
    full_page: true
  - action: get_dom_snapshot
    name: provider-calendar-desktop-light.html
  - action: get_console_errors
  - action: get_network_errors
- id: provider_calendar_mobile_light

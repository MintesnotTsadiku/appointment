app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: Administrator
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: dark
  reduced_motion: reduce
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: admin_admin_dashboard_desktop_dark
  title: admin /admin/dashboard desktop dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /admin/dashboard
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: admin-admin-dashboard-desktop-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: admin-admin-dashboard-desktop-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: admin_admin_dashboard_mobile_dark
  title: admin /admin/dashboard mobile dark
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /admin/dashboard
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: admin-admin-dashboard-mobile-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: admin-admin-dashboard-mobile-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: admin_home_desktop_dark
  title: admin /home desktop dark
  viewport:
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: admin-home-desktop-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: admin-home-desktop-dark.html
  - action: get_console_errors
  - action: get_network_errors
- id: admin_home_mobile_dark
  title: admin /home mobile dark
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /home
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: screenshot
    name: admin-home-mobile-dark.png
    full_page: true
  - action: get_dom_snapshot
    name: admin-home-mobile-dark.html
  - action: get_console_errors
  - action: get_network_errors

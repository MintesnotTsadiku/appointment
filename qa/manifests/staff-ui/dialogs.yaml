app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: bloom.owner@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: dialogs_reception_desktop
  title: Reception dialogs desktop
  viewport: &id001
    width: 1440
    height: 900
  checks: []
  routes:
  - path: /reception
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: click
    selector: '[data-qa="reception-new-appointment"]'
  - action: wait_for
    selector: '[role="dialog"], [role="alertdialog"]'
  - action: screenshot
    name: dialog-new-appointment-desktop.png
  - action: press
    selector: '[role="dialog"], [role="alertdialog"]'
    key: Escape
  - action: click
    selector: '[data-qa="reception-add-walkin"]'
  - action: wait_for
    selector: '[role="dialog"], [role="alertdialog"]'
  - action: screenshot
    name: dialog-walkin-desktop.png
  - action: press
    selector: '[role="dialog"], [role="alertdialog"]'
    key: Escape
  - action: get_console_errors
  - action: get_network_errors
- id: dialogs_reception_mobile
  title: Reception dialogs mobile
  viewport:
    width: 390
    height: 844
  checks: []
  routes:
  - path: /reception
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: click
    selector: '[data-qa="reception-new-appointment"]'
  - action: wait_for
    selector: '[role="dialog"], [role="alertdialog"]'
  - action: screenshot
    name: dialog-new-appointment-mobile.png
  - action: press
    selector: '[role="dialog"], [role="alertdialog"]'
    key: Escape
  - action: get_console_errors
  - action: get_network_errors
- id: dialogs_services_desktop
  title: New service dialog
  viewport: *id001
  checks: []
  routes:
  - path: /settings/services
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: click
    selector: '[data-qa="services-new"]'
  - action: wait_for
    selector: '[role="dialog"], [role="alertdialog"]'
  - action: screenshot
    name: dialog-new-service-desktop.png
  - action: press
    selector: '[role="dialog"], [role="alertdialog"]'
    key: Escape
  - action: get_console_errors
  - action: get_network_errors
- id: dialogs_team_revoke
  title: Revoke confirmation
  viewport: *id001
  checks: []
  routes:
  - path: /settings/team
    assertions:
    - type: network_idle
    - type: no_blank_page
  actions:
  - action: click
    selector: :nth-match([data-qa="team-revoke"]:not([disabled]), 1)
  - action: wait_for
    selector: '[role="dialog"], [role="alertdialog"]'
  - action: screenshot
    name: dialog-team-revoke.png
  - action: press
    selector: '[role="dialog"], [role="alertdialog"]'
    key: Escape
  - action: get_console_errors
  - action: get_network_errors

app: appointment
base_url: http://127.0.0.84:44430
default_role: Staff
auth:
  type: frappe_session
  username: multi.manager@example.test
  verify_path: /api/method/frappe.auth.get_logged_user
artifact_root: /tmp/agent_browser_qa/appointment-staff-ui
capture_trace: false
capture_video: false
capture_instruction_timeline: false
timeout_ms: 120000
options:
  ignore_baseline_drift: true
  color_scheme: light
fixtures:
  provider: appointment.demo.showcase.browser_values
scenarios:
- id: shell_switcher_desktop
  title: Multi-business user opens the workspace switcher and command palette
  viewport: {width: 1440, height: 900}
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Tena Family Clinic") button'
  - action: wait_for
    selector: '[data-qa="workspace-switcher"]'
  - action: click
    selector: '[data-qa="workspace-switcher"]'
  - action: wait_for
    selector: ':nth-match([data-qa="workspace-option"], 1)'
  - action: screenshot
    name: shell-switcher-open.png
  - action: press
    selector: '[role="menu"]'
    key: Escape
  - action: click
    selector: '[data-qa="shell-search"]'
  - action: wait_for
    selector: '[data-qa="command-palette"]'
  - action: screenshot
    name: shell-command-palette.png
  - action: press
    selector: '[data-qa="command-palette"] input'
    key: Escape
  - action: click
    selector: '[data-qa="topnav-theme"]'
  - action: click
    selector: '[data-qa="topnav-theme"]'
  - action: wait_for
    selector: html.dark
  - action: screenshot
    name: shell-dark.png
  - action: get_console_errors
  - action: get_network_errors
- id: shell_menu_mobile
  title: Mobile navigation sheet
  viewport: {width: 390, height: 844}
  checks: []
  routes:
  - path: /workspaces
    assertions:
    - type: network_idle
    - type: visible_selector
      value: '[data-qa="workspace-card"]'
  actions:
  - action: click
    selector: '[data-qa="workspace-card"]:has-text("Tena Family Clinic") button'
  - action: wait_for
    selector: '[data-qa="shell-menu"]'
  - action: click
    selector: '[data-qa="shell-menu"]'
  - action: wait_for
    selector: '[role="dialog"] [data-qa="nav-analytics"]'
  - action: screenshot
    name: shell-mobile-menu.png
  - action: press
    selector: '[role="dialog"]'
    key: Escape
  - action: get_console_errors
  - action: get_network_errors
